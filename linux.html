<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linux & Web Tech</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231a1a18%22/%3E%3Crect x=%22.75%22 y=%22.75%22 width=%2230.5%22 height=%2230.5%22 rx=%227.25%22 fill=%22none%22 stroke=%22%23fff%22 stroke-opacity=%22.22%22 stroke-width=%221.5%22/%3E%3Cpath d=%22M16 5.25c-3 0-4.75 2.4-4.75 5.4 0 1.6.3 2.6-.8 4.1-1.6 2.1-2.5 4.3-2.5 6.6 0 2.9 3.2 4.4 8.05 4.4s8.05-1.5 8.05-4.4c0-2.3-.9-4.5-2.5-6.6-1.1-1.5-.8-2.5-.8-4.1 0-3-1.75-5.4-4.75-5.4z%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.2%22 stroke-linejoin=%22round%22/%3E%3Cellipse cx=%2216%22 cy=%2219.6%22 rx=%223.5%22 ry=%224.5%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2214.35%22 cy=%229.9%22 r=%221.15%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2217.65%22 cy=%229.9%22 r=%221.15%22 fill=%22%23fff%22/%3E%3Cpath d=%22M14.5 12.4h3l-1.5 1.7z%22 fill=%22%23e07a6b%22 stroke=%22%23e07a6b%22 stroke-width=%221%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M9.6 26.2h4.2M18.2 26.2h4.2%22 stroke=%22%23e07a6b%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
:root{
    color-scheme:light;
    --wall:#EDEEEA;
    --wall-deep:#E4E6E0;
    --card:#F6F7F3;
    --ink:#1A1A18;
    --ink-soft:#5D6059;
    --ghost:#9C9A93;
    --marker:#A83B2E;
    --ok:#2E7D4F;
    --rule:rgba(26,26,24,.14);
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
    margin:0;
    background:var(--wall);
    color:var(--ink);
    font:400 16.5px/1.6 var(--sans);
    padding:0 20px 100px;
}
.page{width:100%;margin:0}

header{padding:14px 0 0}
h1{
    font:700 clamp(30px,7vw,44px)/1.02 var(--cond);
    letter-spacing:-.015em;
    margin:0 0 14px;
}
.lede{
    margin:0 0 30px;
    max-width:56ch;
    color:var(--ink-soft);
    font-size:15.5px;
}
.channels{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:4px 14px;
    margin:-30px 0 40px;
    font:400 12.5px/1.35 var(--mono);
    color:var(--ink-soft);
}
.channels-label{
    font:500 9.5px/1 var(--mono);
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--ghost);
}
.channel + .channel::before{content:"·";color:var(--ghost);margin-right:14px}
/* the name in full ink at medium weight, so it stands apart from its faint details */
a.channel{color:var(--ink);font-weight:500;text-decoration:none}
a.channel:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.channel-meta{color:var(--ghost);font-weight:400;font-size:11.5px;margin-left:6px}
a.by{color:var(--ghost);text-decoration:none}

.reset{
    margin-left:auto;
    background:none;
    border:0;
    padding:2px 0;
    font:400 12.5px var(--mono);
    color:var(--ghost);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
}
.reset:focus-visible{outline:2px solid var(--ink-soft);outline-offset:2px}
.score{display:flex;flex-direction:column;gap:7px}
.score .num{
    font:500 38px/.9 var(--mono);
    letter-spacing:-.025em;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
}
.score-label{
    font:500 9.5px/1 var(--mono);
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--ghost);
}
.score-label .reset{margin-left:10px;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase}
@media (max-width:520px){ .score .num{font-size:30px} }

.layer{
    position:relative;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:22px 24px 26px;
    margin:0 0 22px;
}
.layer.collapsed{padding-bottom:22px}

.ch{
    display:block;
    font:500 11px/1 var(--mono);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ghost);
    margin-bottom:5px;
}
.nothing{
    margin:0;
    font:400 13px/1.5 var(--sans);
    color:var(--ghost);
    font-style:italic;
    padding:2px 0 4px;
}

[hidden]{display:none!important}

.sec{margin:0 0 36px}
.sec:last-child{margin-bottom:0}
.sec h3{
    font:600 14px/1.3 var(--cond);
    letter-spacing:.015em;
    margin:0 0 6px;
    color:var(--ink);
}
.sec-n{
    display:block;
    font:500 11px/1 var(--mono);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ghost);
    margin-bottom:5px;
}

.layer h2.ch-head{margin:0 0 22px} /* Heavy's too, so its sections line up with Light's */
.layer.collapsed h2.ch-head{margin-bottom:0}
.ch-toggle{
    display:flex;
    align-items:baseline;
    gap:9px;
    width:100%;
    background:none;
    border:0;
    padding:0 0 2px;
    cursor:pointer;
    text-align:left;
    color:inherit;
    font:inherit;
    flex-wrap:wrap;
}
.ch-toggle .ch{margin-bottom:5px;flex:none;width:100%}
.ch-sep{color:var(--ghost);padding:0 4px}
.ch-time{color:var(--ink-soft)}
.ch-pct{color:var(--ink-soft);float:right;margin-left:12px} /* right edge of the header's top line */
.sec-sep{color:var(--ghost);padding:0 3px}
.sec-time{color:var(--ink-soft)}
.ch-pct.complete{color:var(--ok)}
.ch-pct svg{width:1.25em;height:1.25em;display:block}
.ch-pct path,.sec-ring-pct path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* section progress: a small version of the top bar's ring, on the right of the header */
.sec-ring{grid-column:3;grid-row:1 / span 2;align-self:center;position:relative;width:28px;height:28px}
.sec-ring > svg{width:28px;height:28px;display:block;transform:rotate(-90deg)}
.sec-ring circle{fill:none;stroke-width:2.5}
.sec-ring-track{stroke:var(--rule)}
.sec-ring-fill{
    stroke:var(--ink-soft);
    stroke-linecap:round;
    stroke-dasharray:72.26; /* 2π × 11.5 */
    stroke-dashoffset:72.26;
    transition:stroke-dashoffset .4s ease;
}
.sec-ring-pct{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font:500 8px/1 var(--mono);
    color:var(--ink-soft);
}
.sec-ring-pct svg{width:12px;height:12px;display:block}
.sec-ring.complete .sec-ring-fill{stroke:var(--ok)}
.sec-ring.complete .sec-ring-pct{color:var(--ok)}
.sec.collapsed .sec-ring{grid-row:1} /* only the number line is left, so centre the ring on it */
.ch-name{
    font:700 27px/1.12 var(--cond);
    letter-spacing:.005em;
    color:var(--ink);
    flex:1;
}
.ch-toggle:focus-visible{outline:2px solid var(--ink-soft);outline-offset:3px}
.ch-caret{
    flex:none;
    width:9px;height:9px;
    border-right:1.5px solid var(--ghost);
    border-bottom:1.5px solid var(--ghost);
    transform:rotate(45deg) translate(-2px,-2px);
    transition:transform .18s ease;
}
.ch-toggle[aria-expanded="false"] .ch-caret{transform:rotate(-45deg) translate(-1px,1px)}
.layer.collapsed .layer-body{display:none}
.sec-toggle{
    display:grid;
    grid-template-columns:auto 1fr auto; /* caret, the header text, then the progress ring */
    min-height:28px; /* the ring's height, so a section with no ring (an empty one) is as tall as one with */
    column-gap:9px;
    align-items:center;
    width:100%;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    text-align:left;
    color:inherit;
    font:inherit;
}
.sec-name{grid-column:2}
.sec-toggle:focus-visible{outline:2px solid var(--ink-soft);outline-offset:3px}
.sec-caret{width:7px;height:7px;position:relative;top:-2px} /* level with the capitals beside it */
.sec-toggle[aria-expanded="false"] .ch-caret{transform:rotate(-45deg) translate(-1px,1px)}
.sec.collapsed ul{display:none}
.sec.collapsed h3{margin-bottom:0}
.sec.collapsed:not(:last-child){margin-bottom:20px}
/* a closed section shows just its number and progress */
.sec.collapsed .sec-sep,
.sec.collapsed .sec-time,
.sec.collapsed .sec-name{display:none}
.sec.collapsed .sec-n{margin-bottom:0}
.sec-short{display:none}
.sec.collapsed .sec-short{display:inline} /* "Section 1 - Access Control": the name's first two words, only when closed */

ul{list-style:none;margin:0;padding:0}
li{
    display:flex;gap:12px;
    padding:9px 0;
}
/* the row a channel name in the top bar jumped to */
li.jumped{animation:jumped 2s ease-out}
@keyframes jumped{
    0%,35%{background:var(--wall-deep);box-shadow:0 0 0 8px var(--wall-deep)}
    100%{background:transparent;box-shadow:0 0 0 8px transparent}
}

.box{
    flex:none;width:17px;height:17px;margin-top:3px;
    border:1.5px solid var(--ink);background:transparent;
    border-radius:2px;cursor:pointer;padding:0;
    display:grid;place-items:center;
}
.box svg{width:13px;height:13px;display:block}
.box path{
    fill:none;stroke:var(--marker);stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:22;stroke-dashoffset:22;
}
.box[aria-checked="true"]{border-color:var(--marker)}
.box[aria-checked="true"] path{stroke-dashoffset:0;transition:stroke-dashoffset .28s ease}
.box:focus-visible{outline:2px solid var(--ink-soft);outline-offset:2px}

.body{flex:1;min-width:0}
.ttl{font-size:15.5px;line-height:1.42}
.tag{
    font:500 11.5px/1 var(--mono);
    color:var(--ghost);
    margin-right:7px;
    vertical-align:1.5px;
    letter-spacing:.02em;
}
li.done .tag{color:var(--marker)}
.ttl a{color:var(--ink);text-decoration:none}
.meta{
    font:400 12.5px/1.5 var(--mono);
    color:var(--ink-soft);margin-top:3px;
}
.by{color:var(--ghost)}

li.done .ttl{opacity:.42}
li.done .meta{opacity:.42}

code{font:400 12.5px var(--mono);background:var(--wall-deep);padding:1px 4px;border-radius:2px}

.columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 64px;
    align-items:start;
    margin-top:8px;
}
.col{min-width:0}

.col-head{
    padding:0 0 14px;
    margin-bottom:14px;
    display:flex;
    flex-direction:column;
    gap:22px;
}
.col-head h2{
    font:700 15px/1.2 var(--cond);
    letter-spacing:.09em;
    text-transform:uppercase;
    margin:0 0 6px;
    order:2;
}
.col-head .score{order:1}
.col-read .col-head h2{color:var(--ink-soft)}

@media (max-width:900px){
    .columns{grid-template-columns:1fr;gap:0}
    .col-read{margin-top:34px}
}

@media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
        color-scheme:dark;
        --wall:#16171A;
        --wall-deep:#212328;
        --card:#1E2025;
        --ink:#E8E8E4;
        --ink-soft:#A8ABA2;
        --ghost:#8A8D84;
        --marker:#D4705F;
        --ok:#5DBE86;
        --rule:rgba(232,232,228,.16);
    }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --wall:#16171A;
    --wall-deep:#212328;
    --card:#1E2025;
    --ink:#E8E8E4;
    --ink-soft:#A8ABA2;
    --ghost:#8A8D84;
    --marker:#D4705F;
    --ok:#5DBE86;
    --rule:rgba(232,232,228,.16);
}

.home{text-decoration:none} /* the home link, drawn like the theme toggle */
.theme-toggle:focus-visible{outline:2px solid var(--ink-soft);outline-offset:2px}
.theme-toggle svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .moon{display:none}
:root[data-theme="dark"] .theme-toggle .sun{display:none}
:root[data-theme="dark"] .theme-toggle .moon{display:block}
@media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .theme-toggle .sun{display:none}
    :root:not([data-theme="light"]) .theme-toggle .moon{display:block}
}

.topbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    gap:18px;
    padding:12px 0;
    margin-bottom:26px;
    background:var(--wall);
    border-bottom:1px solid var(--rule);
}
.brand{
    font:700 19px/1.1 var(--cond);
    letter-spacing:-.005em;
    color:var(--ink);
    flex:1;
    min-width:0;
}
.topbar-right{display:flex;align-items:center;gap:14px;flex:none}
.fold-all{
    background:none;
    border:0;
    padding:4px 0;
    font:500 10.5px/1 var(--mono);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
}
.fold-all:hover{color:var(--ink)}
.fold-all:focus-visible{outline:2px solid var(--ink-soft);outline-offset:2px}

.ring{position:relative;width:40px;height:40px;flex:none}
.ring svg{width:40px;height:40px;display:block;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring-track{stroke:var(--wall-deep)}
.ring-fill{
    stroke:var(--ink-soft); /* same as the section rings */
    stroke-linecap:round;
    stroke-dasharray:103.67;
    stroke-dashoffset:103.67;
    transition:stroke-dashoffset .4s ease;
}
.ring-pct{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font:500 10px/1 var(--mono);
    color:var(--ink-soft);
}

.theme-toggle{
    display:grid;
    place-items:center;
    width:34px;height:34px;
    padding:0;
    border:1.5px solid var(--rule);
    border-radius:50%;
    background:var(--wall);
    color:var(--ink-soft);
    cursor:pointer;
    flex:none;
}

@media (max-width:480px){
    body{padding:0 16px 80px}
    .layer{padding:18px 16px 20px}
    .brand{font-size:16px}
    .topbar{gap:10px}
}
@media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    li.jumped{animation:none;background:var(--wall-deep);box-shadow:0 0 0 8px var(--wall-deep)}
}

<body>
<div class="page">

    <nav class="topbar">
        <a class="theme-toggle home" href="index.html" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V19a1 1 0 0 0 1 1h3.5v-5.5h4V20h3.5a1 1 0 0 0 1-1V9.5"/></svg></a>
        <span class="brand">Linux & Web Tech</span>
        <div class="topbar-right">
            <button class="fold-all" id="fold-all" type="button">Close all</button>
            <div class="ring" id="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                 aria-label="Progress">
                <svg viewBox="0 0 40 40" aria-hidden="true">
                    <circle class="ring-track" cx="20" cy="20" r="16.5"/>
                    <circle class="ring-fill" id="ring-fill" cx="20" cy="20" r="16.5"/>
                </svg>
                <span class="ring-pct" id="pct">0%</span>
            </div>
            <button class="theme-toggle" id="theme" type="button" aria-label="Switch colour theme"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
        </div>
    </nav>

    <header>
        <p class="channels" id="channels"><span class="channels-label">Channels</span></p>
    </header>

    <main class="columns" id="board">
        <div class="col col-video" id="col-light"></div>
        <div class="col col-read" id="col-heavy"></div>
    </main>

</div>

<script>
(() => {
"use strict";

const TITLE = "Linux, Networking, Deployment & Cryptography";
/* all chapters count toward the total */
const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.6 L6.2 12.2 L13.5 3.8"/></svg>';
const SEC_RING = '<span class="sec-ring" role="img" aria-label="0% done"><svg viewBox="0 0 28 28" aria-hidden="true">'
    + '<circle class="sec-ring-track" cx="14" cy="14" r="11.5"/><circle class="sec-ring-fill" cx="14" cy="14" r="11.5"/>'
    + '</svg><span class="sec-ring-pct">0%</span></span>';
const KEY = "infra-board-v4";
const OPEN_KEY = "infra-board-collapsed-v2";
const THEME_KEY = "infra-board-theme";

const hhmm = s => { const m = Math.round(s / 60); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* first two words of a section name, for its closed header, stopping at punctuation and dropping a dangling
   "and"/"for": "Access Control & The…" → "Access Control", "Containers 1: …" → "Containers 1", "Volumes and Encryption" → "Volumes" */
const shortName = name => {
    const words = String(name).split(/[,:;&/()]/)[0].trim().split(/\s+/).filter(Boolean).slice(0, 2);
    if (words.length === 2 && /^(and|or|for|of|the|to|with|in|on)$/i.test(words[1])) words.pop();
    const w = words.join(" ");
    return w ? `<span class="sec-short"> - ${esc(w)}</span>` : "";
};
const slug = (prefix, title) => {
    let base = prefix + ":" + title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
    return base;
};

/* ---------- fetch both JSON files, then render ---------- */
/* no-cache: always check with the server, so edits to the JSON show on the next load */
Promise.all([
    fetch("data/linux-light.json", { cache: "no-cache" }).then(r => r.json()),
    fetch("data/linux-heavy.json", { cache: "no-cache" }).then(r => r.json()).catch(() => ({}))
]).then(([light, heavy]) => {
    render(light, heavy);
    initInteractions();
    initTheme();
});

function render(light, heavy) {
    const colLight = document.getElementById("col-light");
    const colHeavy = document.getElementById("col-heavy");
    const channelsEl = document.getElementById("channels");

    /* numbering: playlists get p1.., singles get v1.. across all of Light */
    let np = 0, nv = 0;

    /* collect channels (item count, with 5+ items making the bar; a playlist counts as one), their videos and
       playlists, and their Light runtime */
    const chanCount = new Map();
    const chanPls = new Map();
    const chanSecs = new Map();
    for (const ch of Object.values(light)) {
        for (const sec of Object.values(ch.sections)) {
            for (const v of sec.videos) {
                if (!v.channel_name) continue;
                chanCount.set(v.channel_name, (chanCount.get(v.channel_name) || 0) + 1);
                if (v.type === "playlist") chanPls.set(v.channel_name, (chanPls.get(v.channel_name) || 0) + 1);
                chanSecs.set(v.channel_name, (chanSecs.get(v.channel_name) || 0) + (+v.minutes || 0) * 60);
            }
        }
    }
    /* each bar channel's first Light row gets an id, in order of appearance, for the bar to jump to */
    const chanFirst = new Map();

    /* count totals for Light header */
    let totalRuntime = 0, totalItems = 0;
    const chKeys = Object.keys(light).sort((a, b) => +a - +b);
    for (const k of chKeys) {
        const ch = light[k];
        for (const sec of Object.values(ch.sections)) {
            for (const v of sec.videos) {
                totalRuntime += (+v.minutes || 0) * 60;
                totalItems++;
            }
        }
    }

    /* ---------- build Light column ---------- */
    colLight.innerHTML = `
        <div class="col-head">
            <h2>Light</h2>
            <div class="score"><b class="num">${hhmm(totalRuntime)}</b><span class="score-label">watch time · ${totalItems} items</span></div>
        </div>`;

    for (const chNum of chKeys) {
        const ch = light[chNum];
        const chId = "ch" + chNum;
        /* chapter runtime */
        let chSecs = 0;
        for (const sec of Object.values(ch.sections)) {
            for (const v of sec.videos) chSecs += (+v.minutes || 0) * 60;
        }
        const chTime = (chSecs ? `<span class="ch-sep"> · </span><span class="ch-time">${hhmm(chSecs)}</span>` : "")
            + `<span class="ch-pct">0% done</span>`;

        /* sections HTML */
        let secsHtml = "";
        for (let si = 0; si < ch.sections.length; si++) {
            const sec = ch.sections[si];
            const sNum = si + 1;
            let secSecs = 0;
            let rowsHtml = "";

            for (const v of sec.videos) {
                const secs = (+v.minutes || 0) * 60;
                secSecs += secs;
                const isPl = v.type === "playlist";
                const tag = isPl ? "p" + (++np) : "v" + (++nv);
                const id = slug(chId, v.name);
                const first = v.channel_name && (chanCount.get(v.channel_name) || 0) >= 5 && !chanFirst.has(v.channel_name);
                if (first) chanFirst.set(v.channel_name, "chan-" + (chanFirst.size + 1));
                const byHtml = v.channel_name
                    ? (v.channel_link
                        ? `<a class="by" href="${esc(v.channel_link)}/playlists" target="_blank" rel="noopener">${esc(v.channel_name)}</a>`
                        : `<span class="by">${esc(v.channel_name)}</span>`)
                    : "";
                const metaHtml = [byHtml, v.description].filter(Boolean).join(" · ");

                rowsHtml += `
                    <li${first ? ` id="${chanFirst.get(v.channel_name)}"` : ""} data-id="${esc(id)}"${secs ? ` data-secs="${secs}"` : ""}>
                        <button class="box" role="checkbox" aria-checked="false" aria-label="Mark done: ${esc(v.name)}">${TICK}</button>
                        <div class="body">
                            <div class="ttl"><span class="tag">${tag}</span><a href="${esc(v.link)}" target="_blank" rel="noopener">${esc(v.name)}</a></div>
                            <div class="meta">${metaHtml}</div>
                        </div>
                    </li>`;
            }

            const secTime = secSecs ? `<span class="sec-sep"> · </span><span class="sec-time">${hhmm(secSecs)}</span>` : "";
            const secRing = sec.videos.length ? SEC_RING : "";
            secsHtml += `
                <div class="sec" data-key="v:${chId}/${esc(sec.name)}">
                    <h3><button class="sec-toggle" type="button" aria-expanded="true" aria-controls="${chId}-s${sNum}"><span class="ch-caret sec-caret" aria-hidden="true"></span><span class="sec-n">Section ${sNum}${shortName(sec.name)}${secTime}</span><span class="sec-name">${esc(sec.name)}</span>${secRing}</button></h3>
                    <ul id="${chId}-s${sNum}">${rowsHtml}</ul>
                </div>`;
        }

        colLight.insertAdjacentHTML("beforeend", `
            <section class="layer" id="${chId}" data-sec="${chId}" data-col="v">
                <h2 class="ch-head"><button class="ch-toggle" type="button" aria-expanded="true" aria-controls="${chId}-body"><span class="ch">Chapter ${chNum}${chTime}</span><span class="ch-name">${esc(ch.name)}</span><span class="ch-caret" aria-hidden="true"></span></button></h2>
                <div class="layer-body" id="${chId}-body">${secsHtml}</div>
            </section>`);
    }

    /* render channel bar: each channel's Light videos, playlists and watch time ("17 videos, 2 playlists, 16h 23m",
       leaving out a zero count); the name jumps to its first item (see initInteractions) */
    const count = (n, word) => n ? `${n} ${word}${n === 1 ? "" : "s"}` : "";
    for (const [name, anchor] of chanFirst) {
        const pls = chanPls.get(name) || 0;
        const meta = [count(chanCount.get(name) - pls, "video"), count(pls, "playlist"), hhmm(chanSecs.get(name))].filter(Boolean).join(", ");
        channelsEl.insertAdjacentHTML("beforeend",
            `<a class="channel" href="#${anchor}" data-jump="${anchor}">${esc(name)}<span class="channel-meta">${meta}</span></a>`);
    }

    /* ---------- build Heavy column ---------- */
    const heavyKeys = Object.keys(heavy).sort((a, b) => +a - +b);
    /* merge chapter names from Light when Heavy is empty for that chapter */
    const allChKeys = [...new Set([...chKeys, ...heavyKeys])].sort((a, b) => +a - +b);
    /* numbering: same as Light, playlists get p1.., singles get v1.. across all of Heavy */
    let hp = 0, hv = 0;

    colHeavy.innerHTML = `
        <div class="col-head">
            <h2>Heavy</h2>
            <div class="score" id="progress-label"><b class="num" id="watched">0h 00m</b><span class="score-label">completed · <span id="done">0</span> of ${totalItems} items</span></div>
        </div>`;

    for (const chNum of allChKeys) {
        const chId = "ch" + chNum;
        const chHeavy = heavy[chNum];
        const chLight = light[chNum];
        const name = (chHeavy && chHeavy.name) || (chLight && chLight.name) || "Chapter " + chNum;

        let bodyHtml = "", chItems = 0;
        if (chHeavy && chHeavy.sections) {
            for (let si = 0; si < chHeavy.sections.length; si++) {
                const sec = chHeavy.sections[si];
                const sNum = si + 1;
                let rowsHtml = "";
                chItems += sec.videos.length;
                for (const v of sec.videos) {
                    const secs = (+v.minutes || 0) * 60;
                    const tag = v.type === "playlist" ? "p" + (++hp) : "v" + (++hv);
                    const id = slug(chId, v.name);
                    const byHtml = v.channel_name
                        ? (v.channel_link
                            ? `<a class="by" href="${esc(v.channel_link)}/playlists" target="_blank" rel="noopener">${esc(v.channel_name)}</a>`
                            : `<span class="by">${esc(v.channel_name)}</span>`)
                        : "";
                    const metaHtml = [byHtml, v.description].filter(Boolean).join(" · ");
                    rowsHtml += `
                        <li class="gap" data-id="${esc(id)}"${secs ? ` data-secs="${secs}"` : ""}>
                            <button class="box" role="checkbox" aria-checked="false" aria-label="Mark done: ${esc(v.name)}">${TICK}</button>
                            <div class="body">
                                <div class="ttl"><span class="tag">${tag}</span><a href="${esc(v.link)}" target="_blank" rel="noopener">${esc(v.name)}</a></div>
                                <div class="meta">${metaHtml}</div>
                            </div>
                        </li>`;
                }
                bodyHtml += `
                    <div class="sec" data-key="g:${chId}/${esc(sec.name)}">
                        <h3><button class="sec-toggle" type="button" aria-expanded="true" aria-controls="${chId}-read-s${sNum}"><span class="ch-caret sec-caret" aria-hidden="true"></span><span class="sec-n">Section ${sNum}${shortName(sec.name)}</span><span class="sec-name">${esc(sec.name)}</span>${SEC_RING}</button></h3>
                        <ul id="${chId}-read-s${sNum}">${rowsHtml}</ul>
                    </div>`;
            }
        }

        colHeavy.insertAdjacentHTML("beforeend", `
            <section class="layer read${bodyHtml ? "" : " empty"}" id="${chId}-read" data-sec="${chId}" data-col="g">
                <h2 class="ch-head"><button class="ch-toggle" type="button" aria-expanded="true" aria-controls="${chId}-read-body"><span class="ch">Chapter ${chNum}${chItems ? `<span class="ch-pct">0% done</span>` : ""}</span><span class="ch-name">${esc(name)}</span><span class="ch-caret" aria-hidden="true"></span></button></h2>
                <div class="layer-body" id="${chId}-read-body">${bodyHtml}</div>
            </section>`);
    }
}

/* ---------- interactions (checkboxes, progress, collapse) ---------- */
function initInteractions() {
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
    let state = load();

    const board = document.getElementById("board");
    const items = [...board.querySelectorAll("li[data-id]")];
    const doneEl = document.getElementById("done");

    /* a video moved to another chapter keeps its tick: ids are "ch<N>:<slug>", so a tick whose id no longer
       has a row moves to the one row with the same slug under another chapter */
    const rowIds = new Set(items.map(li => li.dataset.id));
    const bySlug = new Map();
    rowIds.forEach(id => {
        const s = id.slice(id.indexOf(":") + 1);
        bySlug.set(s, [...(bySlug.get(s) || []), id]);
    });
    let movedTicks = false;
    for (const id of Object.keys(state)) {
        if (rowIds.has(id)) continue;
        const to = bySlug.get(id.slice(id.indexOf(":") + 1)) || [];
        if (to.length !== 1 || state[to[0]]) continue;
        state[to[0]] = true;
        delete state[id];
        movedTicks = true;
    }
    if (movedTicks) save();

    function paintItem(li) {
        const on = !!state[li.dataset.id];
        const btn = li.querySelector(".box");
        const title = li.querySelector(".ttl").textContent.trim();
        li.classList.toggle("done", on);
        btn.setAttribute("aria-checked", on ? "true" : "false");
        btn.setAttribute("aria-label", (on ? "Mark not done: " : "Mark done: ") + title);
    }

    /* section-done tracking */
    const parts = new Map();
    board.querySelectorAll("section.layer").forEach(block => {
        const id = block.dataset.sec;
        if (!parts.has(id)) parts.set(id, { blocks: [], rows: [] });
        const p = parts.get(id);
        p.blocks.push(block);
        p.rows.push(...block.querySelectorAll("li[data-id]"));
    });

    const secsOf = li => parseInt(li.dataset.secs || "0", 10);

    /* percentage — same measure as the ring: watched time over non-gap items; Heavy (heavy = true) counts its own
       rows. An empty Heavy section keeps its ring at 0% (nothing in it to finish) and an empty Heavy chapter shows
       no percentage (see render), so neither ever shows the green check */
    function progressOf(allRows, heavy = false) {
        const rows = heavy ? allRows : allRows.filter(li => !li.classList.contains("gap"));
        const total = rows.reduce((a, li) => a + secsOf(li), 0);
        const seen = rows.filter(li => !!state[li.dataset.id]);
        const got = total ? seen.reduce((a, li) => a + secsOf(li), 0) / total
                          : (rows.length ? seen.length / rows.length : 0);
        const pct = Math.floor(got * 100); /* floor, so 100% only once everything is ticked */
        return { pct, label: (pct === 0 && seen.length ? "<1" : pct) + "%" };
    }

    /* chapter: text, or a green check instead of "100% done" */
    function paintPct(el, rows, heavy) {
        const { pct, label } = progressOf(rows, heavy);
        const complete = pct === 100;
        if (complete) el.innerHTML = TICK;
        else el.textContent = label + " done";
        complete ? el.setAttribute("role", "img") : el.removeAttribute("role");
        complete ? el.setAttribute("aria-label", "100% done") : el.removeAttribute("aria-label");
        el.title = complete ? "100% done" : "";
        el.classList.toggle("complete", complete);
        return pct;
    }

    /* section: the ring fills with progress, and holds a green check at 100% */
    const SEC_CIRC = 2 * Math.PI * 11.5;
    function paintRing(el, rows, heavy) {
        const { pct, label } = progressOf(rows, heavy);
        const complete = pct === 100;
        el.querySelector(".sec-ring-fill").style.strokeDashoffset = SEC_CIRC * (1 - pct / 100);
        el.querySelector(".sec-ring-pct").innerHTML = complete ? TICK : label;
        el.setAttribute("aria-label", label + " done");
        el.title = label + " done";
        el.classList.toggle("complete", complete);
        return pct;
    }

    /* chapter percentage, then each of its sections' */
    function paintChapterPct(p) {
        p.blocks.forEach(b => {
            const heavy = b.dataset.col === "g"; /* a Heavy chapter counts only its own rows */
            const chRows = heavy ? [...b.querySelectorAll("li[data-id]")] : p.rows;
            b.querySelectorAll(".ch-pct").forEach(el => paintPct(el, chRows, heavy));
            b.querySelectorAll(".sec").forEach(sec => {
                const el = sec.querySelector(".sec-ring");
                if (el) sec.classList.toggle("done", paintRing(el, [...sec.querySelectorAll("li[data-id]")], heavy) === 100);
            });
        });
    }

    function paintSection(id) {
        const p = parts.get(id);
        if (!p) return;
        const done = p.rows.length > 0 && p.rows.every(li => !!state[li.dataset.id]);
        p.blocks.forEach(b => b.classList.toggle("done", done));
        paintChapterPct(p);
    }

    /* progress ring — all non-gap items */
    const approved = items.filter(li => !li.classList.contains("gap"));
    const totalSecs = approved.reduce((a, li) => a + secsOf(li), 0);
    const CIRC = 2 * Math.PI * 16.5;

    const ringFill = document.getElementById("ring-fill");
    const ring = document.getElementById("ring");
    const pctEl = document.getElementById("pct");
    const watchedEl = document.getElementById("watched");

    function paintTotal() {
        const seen = approved.filter(li => !!state[li.dataset.id]);
        const secs = seen.reduce((a, li) => a + secsOf(li), 0);
        const pct = totalSecs ? Math.round((secs / totalSecs) * 100) : 0;
        if (doneEl) doneEl.textContent = seen.length;
        if (watchedEl) watchedEl.textContent = hhmm(secs);
        if (pctEl) pctEl.textContent = pct + "%";
        if (ringFill) ringFill.style.strokeDashoffset = CIRC * (1 - pct / 100);
        if (ring) ring.setAttribute("aria-valuenow", pct);
    }

    function paintAll() {
        items.forEach(paintItem);
        parts.forEach((_, id) => paintSection(id));
        paintTotal();
    }

    /* ticking */
    board.addEventListener("click", e => {
        const btn = e.target.closest(".box");
        if (!btn || !board.contains(btn)) return;
        const li = btn.closest("li[data-id]");
        if (!li) return;
        state[li.dataset.id] = !state[li.dataset.id];
        if (!state[li.dataset.id]) delete state[li.dataset.id];
        save();
        paintItem(li);
        paintSection(li.closest("section.layer").dataset.sec);
        paintTotal();
        btn.focus();
    });

    paintAll();

    /* collapse */
    const readCollapsed = (() => {
        try { return new Set(JSON.parse(localStorage.getItem(OPEN_KEY)) || []); } catch (e) { return new Set(); }
    })();
    const saveCollapsed = () => { try { localStorage.setItem(OPEN_KEY, JSON.stringify([...readCollapsed])); } catch (e) {} };
    const keyOf = section => (section.dataset.col || "g") + ":" + section.dataset.sec;

    function paintToggle(btn) {
        const id = keyOf(btn.closest("section.layer"));
        const open = !readCollapsed.has(id);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        btn.closest("section.layer").classList.toggle("collapsed", !open);
    }

    /* sections share the same store, keyed by column, chapter and section name */
    function paintSecToggle(btn) {
        const sec = btn.closest(".sec");
        const open = !readCollapsed.has(sec.dataset.key);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        sec.classList.toggle("collapsed", !open);
    }

    [...document.querySelectorAll(".ch-toggle")].forEach(paintToggle);
    [...document.querySelectorAll(".sec-toggle")].forEach(paintSecToggle);

    /* open all / close all: every section in both columns; opening also opens any closed chapter */
    const foldBtn = document.getElementById("fold-all");
    const allSecs = [...document.querySelectorAll(".sec")];
    const allClosed = () => allSecs.every(sec => readCollapsed.has(sec.dataset.key));
    function paintFold() {
        if (foldBtn) foldBtn.textContent = allClosed() ? "Open all" : "Close all";
    }
    if (foldBtn) foldBtn.addEventListener("click", () => {
        const close = !allClosed();
        allSecs.forEach(sec => close ? readCollapsed.add(sec.dataset.key) : readCollapsed.delete(sec.dataset.key));
        if (!close) document.querySelectorAll("section.layer").forEach(layer => readCollapsed.delete(keyOf(layer)));
        saveCollapsed();
        document.querySelectorAll(".ch-toggle").forEach(paintToggle);
        document.querySelectorAll(".sec-toggle").forEach(paintSecToggle);
        paintFold();
    });
    paintFold();

    document.addEventListener("click", e => {
        const secBtn = e.target.closest(".sec-toggle");
        if (secBtn) {
            const id = secBtn.closest(".sec").dataset.key;
            readCollapsed.has(id) ? readCollapsed.delete(id) : readCollapsed.add(id);
            saveCollapsed();
            paintSecToggle(secBtn);
            paintFold();
            return;
        }
        const btn = e.target.closest(".ch-toggle");
        if (!btn) return;
        const id = keyOf(btn.closest("section.layer"));
        readCollapsed.has(id) ? readCollapsed.delete(id) : readCollapsed.add(id);
        saveCollapsed();
        paintToggle(btn);
    });

    /* channel bar: jump to the channel's first item, opening its chapter and section if they're closed */
    document.getElementById("channels").addEventListener("click", e => {
        const a = e.target.closest("a.channel[data-jump]");
        const li = a && document.getElementById(a.dataset.jump);
        if (!li) return;
        e.preventDefault();
        const layer = li.closest("section.layer");
        const sec = li.closest(".sec");
        readCollapsed.delete(keyOf(layer));
        readCollapsed.delete(sec.dataset.key);
        saveCollapsed();
        paintToggle(layer.querySelector(".ch-toggle"));
        paintSecToggle(sec.querySelector(".sec-toggle"));
        paintFold();
        const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        li.scrollIntoView({ block: "center", behavior: still ? "auto" : "smooth" });
        li.querySelector(".ttl a").focus({ preventScroll: true });
        li.classList.remove("jumped");
        void li.offsetWidth; /* restart the highlight if it's clicked again */
        li.classList.add("jumped");
        clearTimeout(li.jumpTimer);
        li.jumpTimer = setTimeout(() => li.classList.remove("jumped"), 2000);
    });
}

/* ---------- light / dark theme ---------- */
function initTheme() {
    const themeBtn = document.getElementById("theme");
    if (!themeBtn) return;
    const root = document.documentElement;
    const systemDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = () => root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : systemDark();
    const label = () => themeBtn.setAttribute("aria-label", isDark() ? "Switch to light theme" : "Switch to dark theme");
    label();
    themeBtn.addEventListener("click", () => {
        const next = isDark() ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        label();
    });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (!root.getAttribute("data-theme")) label();
    });
}

})();
</script>
</body>
</html>
