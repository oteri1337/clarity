// ---------- Helpers ----------

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const enc = encodeURIComponent;
const plural = (n, word, many = word + 's') => `${n.toLocaleString()} ${n === 1 ? word : many}`;
const pad2 = (n) => String(n).padStart(2, '0');
// Let the status text paint before a long synchronous parse. Animation frames
// stop in a background tab, so a timer backs them up.
const nextFrame = () =>
  new Promise((r) => {
    requestAnimationFrame(() => setTimeout(r, 0));
    setTimeout(r, 60);
  });

// Money is kept in kobo, as signed integers. Every amount on the page goes
// through naira() or compact(), so with figures hidden (the eye button) they
// return a mask instead — the same length whatever the amount.
const nf = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN' });
const naira = (kobo) => (prefs.hideFigures ? '₦•••••' : nf.format(Math.abs(kobo) / 100));
function compact(kobo, digits = 1) {
  if (prefs.hideFigures) return '₦•••';
  const n = Math.abs(kobo) / 100;
  const [v, unit] = n >= 1e9 ? [n / 1e9, 'B'] : n >= 1e6 ? [n / 1e6, 'M'] : n >= 1e3 ? [n / 1e3, 'K'] : [n, ''];
  const shown = !unit || v >= 100 ? Math.round(v) : v.toFixed(digits).replace(/\.?0+$/, '');
  return '₦' + shown + unit;
}
const signed = (t) => (t.transfer_type === 'credit' ? '+' : '−') + naira(t.amount);
const percent = (part, whole) => (whole ? Math.round((part / whole) * 100) + '%' : '–');

// created_at is "YYYY-MM-DD HH:MM:SS" as the statement printed it; never let a
// time zone shift it.
const fmtDate = (s) => `${+s.slice(8, 10)} ${MON[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}`;
const fmtTime = (s) => (s.slice(11) === '00:00:00' ? '' : s.slice(11, 16));
const fmtMonth = (ym) => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
function fmtRange(a, b) {
  if (!a) return '';
  if (a.slice(0, 10) === b.slice(0, 10)) return fmtDate(a);
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}
const bankVar = (bank) => {
  const known = { GTBank: 'gtbank', Kuda: 'kuda', Moniepoint: 'moniepoint', Alat: 'alat', Barter: 'barter', OPay: 'opay', Chipper: 'chipper' }[bank];
  return known ? `var(--bank-${known})` : 'var(--faint)';
};
const bankDot = (bank) => `<span class="bank-dot" style="background:${bankVar(bank)}" aria-hidden="true"></span>`;
const bankLabel = (bank) => BANK_LABELS[bank] || bank;

function readPrefs() {
  try {
    return JSON.parse(localStorage.getItem(PREFS_KEY)) || {};
  } catch {
    return {};
  }
}
function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
  } catch {}
}
const prefs = readPrefs();

// ---------- Storage ----------
// Everything lives in this browser's IndexedDB: the (large) transfers list and
// the small, often-edited rest (accounts, tags, names) under separate keys so a
// tag change never rewrites every transfer.

const kv = (() => {
  let dbp;
  const open = () =>
    (dbp ??= new Promise((resolve, reject) => {
      const req = indexedDB.open('clarity-statements', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', mode);
      const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  };
  return {
    get: (key) => run('readonly', (s) => s.get(key)),
    set: (key, value) => run('readwrite', (s) => s.put(value, key)),
    clear: () => run('readwrite', (s) => s.clear()),
  };
})();

const freshData = () => ({
  accounts: [], // { id, bank_name, account_number }
  transfers: [], // the parsed rows, plus id and account_id
  tags: [], // { party, tag }: party is an account number or a name, as in the server app
  names: {}, // account number -> the name you gave it
  tagList: [...DEFAULT_TAGS],
  recent: [], // recently used tags, newest first
  imports: [], // { file, bank, inserted, skipped, clients, at }
  nextId: 1,
  nextAccountId: 1,
});
let data = freshData();

let saveTimer = null;
let transfersDirty = false;
function save(withTransfers = false) {
  transfersDirty ||= withTransfers;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 120);
}
async function flushSave() {
  saveTimer = null;
  const { transfers, ...meta } = data;
  const writes = [kv.set('meta', meta)];
  if (transfersDirty) writes.push(kv.set('transfers', transfers));
  transfersDirty = false;
  try {
    await Promise.all(writes);
    tabs?.postMessage('saved');
  } catch {
    $('storage-banner').hidden = false;
  }
}

// Don't lose a just-made change if the tab is closed straight away.
addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && saveTimer) {
    clearTimeout(saveTimer);
    flushSave();
  }
});

// Another tab of this page saved: pick up its changes so neither tab
// overwrites the other with stale data.
const tabs = 'BroadcastChannel' in window ? new BroadcastChannel('clarity-statements') : null;
tabs?.addEventListener('message', async () => {
  if (importing || saveTimer) return;
  await load();
  buildIndex();
  route();
});

async function load() {
  try {
    const [meta, transfers] = await Promise.all([kv.get('meta'), kv.get('transfers')]);
    if (meta) data = { ...freshData(), ...meta };
    if (Array.isArray(transfers)) data.transfers = transfers;
    data.tagList = [...new Set([...DEFAULT_TAGS, ...data.tagList])];
  } catch {
    $('storage-banner').hidden = false;
  }
  if (repairBankNames()) save(true);
}

// Transfers read before OPay was always taken as a bank can carry it in the
// name ("Ada Obi Opay Digital Services Limited"). Take it out, set
// the bank, and move any tag on the old name to the new one. Returns how many
// transfers changed.
function repairBankNames() {
  const renamed = new Map(); // old name, lower-cased -> new name
  let changed = 0;
  for (const t of data.transfers) {
    if (!t.account_name) continue;
    const [name, bank] = Parsers.splitBankFromName(t.account_name, t.bank_name);
    if (name === t.account_name) continue;
    if (name) renamed.set(t.account_name.toLowerCase(), name);
    t.account_name = name;
    t.bank_name = Parsers.canonicalBank(bank);
    changed++;
  }
  if (!changed) return 0;
  for (const m of data.tags) {
    const to = renamed.get(String(m.party).toLowerCase());
    if (to) m.party = to;
  }
  const seen = new Set();
  data.tags = data.tags.filter((m) => {
    const k = `${String(m.party).toLowerCase()}\n${m.tag}`;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return changed;
}

// ---------- Index ----------
// A party is one counterparty: its account number when the statement gave one,
// else its lower-cased name (the server's party_key). Tags point at a party by
// account number or by any name it has appeared under.

let ix = { accounts: new Map(), parties: new Map(), aliases: new Map(), tagsOf: new Map() };

const partyKeyOf = (t) => t.account_number || (t.account_name ? t.account_name.toLowerCase() : null);

function topKey(counts) {
  let best = null;
  let n = -1;
  for (const [k, c] of counts) if (c > n) [best, n] = [k, c];
  return best;
}

function buildIndex() {
  const parties = new Map();
  const aliases = new Map(); // lower-cased name -> party keys that appeared under it
  for (const t of data.transfers) {
    const key = partyKeyOf(t);
    if (!key) continue;
    let p = parties.get(key);
    if (!p) {
      p = { key, acct: t.account_number || null, names: new Map(), banks: new Map(), list: [], count: 0, in: 0, out: 0, first: '', last: '' };
      parties.set(key, p);
    }
    p.list.push(t);
    if (t.account_name) {
      p.names.set(t.account_name, (p.names.get(t.account_name) || 0) + 1);
      const lower = t.account_name.toLowerCase();
      if (!aliases.has(lower)) aliases.set(lower, new Set());
      aliases.get(lower).add(key);
    }
    if (t.bank_name) p.banks.set(t.bank_name, (p.banks.get(t.bank_name) || 0) + 1);
    if (t.transfer_category === 'charge') continue;
    p.count++;
    if (t.transfer_type === 'credit') p.in += t.amount;
    else p.out += t.amount;
    if (!p.first || t.created_at < p.first) p.first = t.created_at;
    if (t.created_at > p.last) p.last = t.created_at;
  }
  for (const p of parties.values()) {
    p.name = topKey(p.names);
    p.bank = topKey(p.banks);
  }
  ix = { accounts: new Map(data.accounts.map((a) => [a.id, a])), parties, aliases, tagsOf: new Map() };
  resolveTags();
}

function partiesFor(party) {
  const keys = new Set();
  if (/^\d{10}$/.test(party)) {
    if (ix.parties.has(party)) keys.add(party);
  } else {
    for (const k of ix.aliases.get(String(party).toLowerCase()) || []) keys.add(k);
  }
  return keys;
}

function resolveTags() {
  const tagsOf = new Map();
  for (const { party, tag } of data.tags) {
    for (const key of partiesFor(party)) {
      if (!tagsOf.has(key)) tagsOf.set(key, new Set());
      tagsOf.get(key).add(tag);
    }
  }
  ix.tagsOf = tagsOf;
}

const tagsOf = (key) => (key && ix.tagsOf.get(key)) || new Set();
const displayName = (p) => (p.acct && data.names[p.acct]) || p.name || p.acct;
// People worth labelling: anyone with at least one real (non-charge) transfer.
const labelable = () => [...ix.parties.values()].filter((p) => p.count > 0);

// ---------- Tags ----------

function addTag(key, tag) {
  const p = ix.parties.get(key);
  if (!p) return;
  const party = p.acct || p.name;
  if (!data.tags.some((m) => m.party === party && m.tag === tag)) data.tags.push({ party, tag });
  if (!data.tagList.includes(tag)) data.tagList.push(tag);
  data.recent = [tag, ...data.recent.filter((t) => t !== tag)].slice(0, 5);
  resolveTags();
  save();
  tagsChanged(key);
}

function removeTag(key, tag) {
  data.tags = data.tags.filter((m) => !(m.tag === tag && partiesFor(m.party).has(key)));
  resolveTags();
  save();
  tagsChanged(key);
}

// Repaint every row for this party in place, so labelling never loses your
// scroll position; panels that total by tag re-render.
function tagsChanged(key) {
  document.querySelectorAll(`[data-party="${CSS.escape(key)}"] .tags`).forEach((el) => {
    el.innerHTML = tagCell(key);
  });
  paintLabelCount();
  const v = current.view;
  if (v === 'overview' || v === 'month') paintTagPanels();
  else if (v === 'label') {
    paintLabelSeg();
    paintLabelProgress();
  } else if (v === 'tags' || v === 'tag') route();
}

function tagCell(key) {
  const tags = [...tagsOf(key)].sort();
  const chips = tags
    .map((tag) => `<span class="chip"><a href="#/tag/${enc(tag)}">${esc(tag)}</a><button type="button" data-act="untag" data-tag="${esc(tag)}" aria-label="Remove tag ${esc(tag)}" title="Remove">×</button></span>`)
    .join('');
  const add = tags.length
    ? '<button type="button" class="tag-add plus" data-act="tag" aria-label="Add another tag" title="Add another tag">+</button>'
    : '<button type="button" class="tag-add" data-act="tag">+ Tag</button>';
  return chips + add;
}

// On import, anyone who paid in more than ₦40,000 in a single credit and has no
// tag yet gets "client" (StatementImporter::tagCreditorsAsClient). Only the new
// rows are checked, so removing the tag sticks.
function tagNewClients(rows) {
  let n = 0;
  for (const t of rows) {
    if (t.transfer_type !== 'credit' || t.amount <= CLIENT_MIN) continue;
    const name = (t.account_name || '').trim();
    if (/reversal/i.test(name)) continue;
    const key = partyKeyOf(t);
    if (!key || tagsOf(key).size) continue;
    data.tags.push({ party: t.account_number || name, tag: 'client' });
    resolveTags();
    n++;
  }
  return n;
}

// ---------- Import ----------

const fpKey = (t) => `${t.created_at}|${t.transfer_type}|${t.balance_after}|${t.balance_before}`;

// Add parsed rows to one bank's account, skipping any already there (same
// time, direction and balances), exactly as the server de-duplicates.
function mergeRows(bankName, rows, { tagClients = true } = {}) {
  let account = data.accounts.find((a) => a.bank_name === bankName);
  if (!account) {
    account = { id: data.nextAccountId++, bank_name: bankName, account_number: null };
    data.accounts.push(account);
  }
  const seen = new Set();
  for (const t of data.transfers) if (t.account_id === account.id) seen.add(fpKey(t));
  const fresh = [];
  let skipped = 0;
  for (const r of rows) {
    const k = fpKey(r);
    if (seen.has(k)) {
      skipped++;
      continue;
    }
    seen.add(k);
    fresh.push({
      id: data.nextId++,
      account_id: account.id,
      created_at: r.created_at,
      transfer_type: r.transfer_type,
      transfer_category: r.transfer_category,
      balance_before: r.balance_before,
      balance_after: r.balance_after,
      amount: r.amount,
      remarks: r.remarks || null,
      account_name: r.account_name,
      account_number: r.account_number,
      bank_name: r.bank_name,
    });
  }
  for (const t of fresh) data.transfers.push(t);
  buildIndex();
  const clients = tagClients ? tagNewClients(fresh) : 0;
  return { inserted: fresh.length, skipped, clients };
}

let pdfjsPromise = null;
function loadPdfjs() {
  pdfjsPromise ??= new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = PDFJS.base + 'pdf.min.js';
    script.integrity = PDFJS.lib;
    script.crossOrigin = 'anonymous';
    script.onerror = () => reject(new Error('Couldn’t load the PDF reader. Check your connection and try again.'));
    script.onload = async () => {
      try {
        // The worker is fetched with the same integrity check, then run from a
        // blob so it works on any host.
        const res = await fetch(PDFJS.base + 'pdf.worker.min.js', { integrity: PDFJS.worker });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(await res.blob());
        resolve(window.pdfjsLib);
      } catch {
        reject(new Error('Couldn’t load the PDF reader. Check your connection and try again.'));
      }
    };
    document.head.append(script);
  });
  pdfjsPromise.catch(() => (pdfjsPromise = null));
  return pdfjsPromise;
}

const queue = []; // { id, file, status, note, progress, result, password }
let queueId = 0;
let importing = false;

function addFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  loadPdfjs().catch(() => {});
  for (const file of files) {
    if (queue.some((q) => q.file.name === file.name && q.file.size === file.size && q.status !== 'error')) continue;
    queue.push({ id: ++queueId, file, status: 'queued', note: 'Waiting…', progress: 0 });
  }
  renderImporter();
  runQueue();
}

async function runQueue() {
  if (importing) return;
  importing = true;
  let item;
  while ((item = queue.find((q) => q.status === 'queued'))) {
    try {
      if (/\.json$/i.test(item.file.name) || item.file.type === 'application/json') await importBackup(item);
      else await importPdf(item);
    } catch (err) {
      item.status = 'error';
      item.note = err.message || 'Something went wrong reading this file.';
    }
    renderImporter();
  }
  importing = false;
  renderImporter();
  route();
}

async function importPdf(item) {
  item.status = 'reading';
  item.note = 'Loading the PDF reader…';
  renderImpRow(item);
  const pdfjs = await loadPdfjs();
  const bytes = await item.file.arrayBuffer();
  let pdf;
  try {
    pdf = await pdfjs.getDocument({ data: bytes, isEvalSupported: false, password: item.password }).promise;
  } catch (err) {
    if (err?.name === 'PasswordException') {
      item.status = 'locked';
      item.note = item.password ? 'That password didn’t work. Try again.' : 'This PDF is password-protected.';
      return;
    }
    throw new Error(err?.name === 'InvalidPDFException' ? 'This file isn’t a readable PDF.' : 'Couldn’t open this PDF.');
  }
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    item.note = `Reading page ${p} of ${pdf.numPages}`;
    item.progress = p / pdf.numPages;
    renderImpRow(item);
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    pages.push(Parsers.layoutPage(pdfjs, content, page.getViewport({ scale: 1 })));
    page.cleanup();
  }
  await pdf.destroy();

  item.status = 'parsing';
  item.note = 'Finding transactions…';
  renderImpRow(item);
  await nextFrame();
  const text = pages.join('\n');
  if (!text.trim()) throw new Error('This PDF has no text in it (it may be a scan), so there’s nothing to read.');
  const { bank, rows } = Parsers.importText(text);
  if (!bank) throw new Error(`Not a statement this can read yet. It knows ${SUPPORTED}.`);
  if (!rows.length) throw new Error(`Looks like a ${bankLabel(bank)} statement, but no transactions were found in it.`);

  const res = mergeRows(bank, rows);
  data.imports.unshift({ file: item.file.name, bank, ...res, at: new Date().toISOString() });
  save(true);
  askPersistence();
  item.status = 'done';
  item.result = { bank, ...res };
  item.note = describeResult(item.result);
}

function describeResult(r) {
  const bits = [`${bankLabel(r.bank)}: ${plural(r.inserted, 'new transfer')}`];
  if (r.skipped) bits.push(`${r.skipped.toLocaleString()} already here`);
  if (r.clients) bits.push(`${plural(r.clients, 'client')} tagged`);
  return bits.join(' · ');
}

// Ask the browser not to evict the data under storage pressure.
let askedPersist = false;
function askPersistence() {
  if (askedPersist || !navigator.storage?.persist) return;
  askedPersist = true;
  navigator.storage.persist().catch(() => {});
}

// ---------- Backups ----------
// The server app's combined export ("unified.combined-statement"), plus this
// page's tags and names. Either file restores here; duplicates are skipped.

function exportBackup() {
  if (!data.transfers.length && !data.tags.length) {
    toast('There’s nothing to back up yet.');
    return;
  }
  const bankOf = new Map(data.accounts.map((a) => [a.id, a.bank_name]));
  const payload = {
    version: 1,
    kind: 'unified.combined-statement',
    app: 'clarity-statements',
    exported_at: new Date().toISOString(),
    accounts: data.accounts.map((a) => ({ bank_name: a.bank_name, account_number: a.account_number })),
    transfers: data.transfers.map((t) => ({
      account: bankOf.get(t.account_id) ?? null,
      created_at: t.created_at,
      transfer_type: t.transfer_type,
      transfer_category: t.transfer_category,
      balance_before: t.balance_before,
      balance_after: t.balance_after,
      remarks: t.remarks,
      account_name: t.account_name,
      account_number: t.account_number,
      bank_name: t.bank_name,
    })),
    tags: data.tags,
    names: data.names,
    tag_list: data.tagList.filter((t) => !DEFAULT_TAGS.includes(t)),
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `statements-backup-${new Date().toLocaleDateString('en-CA')}.json`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Downloaded a backup of ${plural(data.transfers.length, 'transfer')} and ${plural(data.tags.length, 'tag')}.`);
}

async function importBackup(item) {
  item.status = 'parsing';
  item.note = 'Reading backup…';
  renderImpRow(item);
  let payload;
  try {
    payload = JSON.parse(await item.file.text());
  } catch {
    throw new Error('This file isn’t valid JSON.');
  }
  if (payload?.kind !== 'unified.combined-statement' || !Array.isArray(payload.transfers)) {
    throw new Error('This isn’t a Statements backup.');
  }
  const accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
  const byBank = new Map();
  let bad = 0;
  for (const t of payload.transfers) {
    const before = Math.trunc(Number(t?.balance_before));
    const after = Math.trunc(Number(t?.balance_after));
    const type = t?.transfer_type;
    const at = typeof t?.created_at === 'string' ? t.created_at.slice(0, 19) : '';
    if ((type !== 'credit' && type !== 'debit') || !/^\d{4}-\d{2}-\d{2}/.test(at) || !Number.isFinite(before) || !Number.isFinite(after)) {
      bad++;
      continue;
    }
    // Server exports overwrite the source bank with the counterparty's; trust
    // a lone account, otherwise do what the server's own restore does.
    const bank = t.account || (accounts.length === 1 ? accounts[0].bank_name : t.bank_name) || 'Imported';
    const amount = Math.abs(after - before);
    const [name, acct] = Parsers.cleanCounterpartyName(t.account_name, t.account_number);
    const row = {
      created_at: at.length === 10 ? at + ' 00:00:00' : at,
      transfer_type: type,
      transfer_category: t.transfer_category === 'charge' || amount < 6000 ? 'charge' : 'transfer',
      balance_before: before,
      balance_after: after,
      amount,
      remarks: t.remarks ?? null,
      account_name: name,
      account_number: acct,
      bank_name: Parsers.canonicalBank(t.bank_name),
    };
    if (!byBank.has(bank)) byBank.set(bank, []);
    byBank.get(bank).push(row);
  }
  let inserted = 0;
  let skipped = bad;
  for (const [bank, rows] of byBank) {
    const r = mergeRows(bank, rows, { tagClients: false });
    inserted += r.inserted;
    skipped += r.skipped;
  }
  let tagsAdded = 0;
  for (const m of Array.isArray(payload.tags) ? payload.tags : []) {
    if (typeof m?.party !== 'string' || typeof m?.tag !== 'string' || !m.party || !m.tag) continue;
    if (data.tags.some((x) => x.party === m.party && x.tag === m.tag)) continue;
    data.tags.push({ party: m.party, tag: m.tag });
    tagsAdded++;
  }
  for (const tag of [...(payload.tag_list || []), ...data.tags.map((m) => m.tag)]) {
    if (typeof tag === 'string' && tag && !data.tagList.includes(tag)) data.tagList.push(tag);
  }
  for (const [acct, name] of Object.entries(payload.names || {})) {
    if (/^\d{10}$/.test(acct) && typeof name === 'string' && name.trim() && !data.names[acct]) data.names[acct] = name.trim();
  }
  repairBankNames();
  buildIndex();
  data.imports.unshift({ file: item.file.name, bank: 'Backup', inserted, skipped, clients: 0, at: new Date().toISOString() });
  save(true);
  item.status = 'done';
  item.result = { bank: 'Backup', inserted, skipped, clients: 0 };
  item.note = `Backup: ${plural(inserted, 'new transfer')}${skipped ? ` · ${skipped.toLocaleString()} already here` : ''}${tagsAdded ? ` · ${plural(tagsAdded, 'tag')} restored` : ''}`;
}

// ---------- Importer panel ----------

// Once a batch finishes, files that went fine fold away behind a toggle;
// problems and password prompts stay in view.
let showDoneFiles = false;

function renderImporter() {
  const panel = $('importer');
  panel.hidden = !queue.length;
  if (!queue.length) return;
  const busy = queue.some((q) => ['queued', 'reading', 'parsing'].includes(q.status));
  const shown = busy || showDoneFiles ? queue : queue.filter((q) => q.status !== 'done');
  $('imp-list').innerHTML = shown.map(impRow).join('');
  $('imp-list').hidden = !shown.length;
  $('imp-title').textContent = busy ? `Importing ${plural(queue.length, 'file')}` : 'Import finished';
  const sum = $('imp-sum');
  sum.hidden = busy;
  if (busy) return;
  const done = queue.filter((q) => q.status === 'done');
  const added = done.reduce((s, q) => s + q.result.inserted, 0);
  const dupes = done.reduce((s, q) => s + q.result.skipped, 0);
  const clients = done.reduce((s, q) => s + q.result.clients, 0);
  const left = labelable().filter((p) => !tagsOf(p.key).size).length;
  const parts = [];
  if (done.length) parts.push(`Added ${plural(added, 'transfer')} from ${plural(done.length, 'file')}`);
  if (dupes) parts.push(`skipped ${dupes.toLocaleString()} already here`);
  if (clients) parts.push(`tagged ${plural(clients, 'person', 'people')} who paid you over ₦40,000 as “client”`);
  sum.innerHTML = `<p>${parts.length ? esc(parts.join(', ')) + '.' : 'Nothing was imported.'}</p>
    <span style="display:flex;flex-wrap:wrap;gap:8px">
      ${done.length ? `<button type="button" class="btn small" data-imp="toggle" aria-expanded="${showDoneFiles}">${showDoneFiles ? 'Hide files' : `Show ${plural(done.length, 'file')}`}</button>` : ''}
      <button type="button" class="btn small" data-imp="dismiss">Dismiss</button>
      ${left ? `<a class="btn small primary" href="#/label" data-imp="dismiss">Label ${plural(left, 'person', 'people')} →</a>` : ''}
    </span>`;
}

function impRow(q) {
  const busy = ['reading', 'parsing'].includes(q.status);
  const remove = busy || q.status === 'queued' ? '' : `<button type="button" class="x" data-imp="remove" data-id="${q.id}" aria-label="Remove ${esc(q.file.name)} from the list">${ICONS.x}</button>`;
  const unlock =
    q.status === 'locked'
      ? `<form class="unlock" data-id="${q.id}"><input type="password" name="pw" placeholder="PDF password" aria-label="Password for ${esc(q.file.name)}" autocomplete="off" required><button class="btn small primary">Unlock</button></form>`
      : '';
  return `<li class="imp ${q.status}" data-qid="${q.id}">
    <div><div class="file">${esc(q.file.name)}</div><div class="note">${esc(q.note)}</div></div>
    ${remove}
    ${busy ? `<div class="bar"><i style="width:${Math.round(q.progress * 100)}%"></i></div>` : ''}
    ${unlock}
  </li>`;
}

// Page-by-page progress repaints just the one row.
function renderImpRow(item) {
  const row = document.querySelector(`[data-qid="${item.id}"]`);
  if (!row) return renderImporter();
  row.outerHTML = impRow(item);
}

$('importer').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-imp]');
  if (!btn) return;
  if (btn.dataset.imp === 'remove') {
    const i = queue.findIndex((q) => String(q.id) === btn.dataset.id);
    if (i >= 0) queue.splice(i, 1);
  } else if (btn.dataset.imp === 'toggle') {
    showDoneFiles = !showDoneFiles;
  } else if (btn.dataset.imp === 'dismiss') {
    for (let i = queue.length - 1; i >= 0; i--) if (!['queued', 'reading', 'parsing', 'locked'].includes(queue[i].status)) queue.splice(i, 1);
    showDoneFiles = false;
  }
  renderImporter();
});

$('importer').addEventListener('submit', (e) => {
  e.preventDefault();
  const item = queue.find((q) => String(q.id) === e.target.dataset.id);
  if (!item) return;
  item.password = e.target.elements.pw.value;
  item.status = 'queued';
  item.note = 'Unlocking…';
  renderImporter();
  runQueue();
});

function route() {
  closePicker();
  const raw = location.hash.replace(/^#\/?/, '');
  const [view = '', ...rest] = raw.split('/');
  let arg = rest.join('/');
  try {
    arg = decodeURIComponent(arg);
  } catch {}
  const changed = current.view !== (view || 'overview') || current.arg !== arg;
  current.view = view || 'overview';
  current.arg = arg;
  const tab = { party: 'label', tag: 'tags', month: 'overview', day: 'overview', bank: 'banks' }[current.view] || current.view;
  document.querySelectorAll('#tabs a').forEach((a) => {
    const on = a.dataset.view === tab;
    if (on) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  paintLabelCount();
  if (listObserver) listObserver.disconnect();

  const views = { overview: viewOverview, label: viewLabel, transfers: viewTransfers, tags: viewTags, banks: viewBanks, party: viewParty, tag: viewTag, month: viewMonth, day: viewDay, bank: viewBank };
  const render = views[current.view] || viewOverview;
  if (!data.transfers.length && current.view !== 'banks' && current.view !== 'tags') renderEmpty();
  else render(arg);
  if (changed) window.scrollTo(0, 0);
}

function yearsWithData() {
  const ys = new Set();
  for (const t of data.transfers) ys.add(t.created_at.slice(0, 4));
  return [...ys].sort().reverse();
}

function totalsOf(rows) {
  const s = { in: 0, out: 0, charges: 0, chargeCount: 0, count: rows.length, first: '', last: '' };
  for (const t of rows) {
    if (t.transfer_type === 'credit') s.in += t.amount;
    else s.out += t.amount;
    if (t.transfer_category === 'charge') {
      s.charges += t.amount;
      s.chargeCount++;
    }
    if (!s.first || t.created_at < s.first) s.first = t.created_at;
    if (t.created_at > s.last) s.last = t.created_at;
  }
  return s;
}

// a tag has the same colour in both pies.
const PIE_COLORS = [
  '#2563eb', '#16a34a', '#f59e0b', '#dc2626', '#7c3aed', '#0891b2', '#db2777',
  '#65a30d', '#ea580c', '#0d9488', '#9333ea', '#ca8a04', '#e11d48', '#4f46e5',
  '#84cc16', '#f97316', '#06b6d4', '#a855f7', '#10b981', '#eab308', '#f43f5e',
  '#3b82f6', '#14b8a6', '#8b5cf6', '#ef4444', '#22c55e', '#6366f1', '#ec4899',
  '#0ea5e9', '#d946ef', '#475569', '#78716c',
];

function pieSvg(parts) {
  const total = parts.reduce((s, [v]) => s + v, 0);
  if (parts.length === 1) return `<svg class="pie" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="100" fill="${parts[0][1]}"/></svg>`;
  const at = (a) => `${(100 + 100 * Math.cos(a)).toFixed(2)} ${(100 + 100 * Math.sin(a)).toFixed(2)}`;
  let a = -Math.PI / 2; // from 12 o'clock, clockwise
  const paths = parts
    .map(([v, color]) => {
      const frac = v / total;
      const a0 = a;
      a += frac * 2 * Math.PI;
      return `<path d="M100 100 L${at(a0)} A100 100 0 ${frac > 0.5 ? 1 : 0} 1 ${at(a)}Z" fill="${color}"/>`;
    })
    .join('');
  return `<svg class="pie" viewBox="0 0 200 200" aria-hidden="true">${paths}</svg>`;
}

// Money out and money in by tag, leaving out bank charges. Money from people
// with no tag yet, or no name on the statement, is noted under each pie.
function tagPies(rows) {
  const sums = { debit: new Map(), credit: new Map() };
  const left = { debit: { unlabelled: 0, nameless: 0 }, credit: { unlabelled: 0, nameless: 0 } };
  for (const t of rows) {
    if (t.transfer_category === 'charge') continue;
    const key = partyKeyOf(t);
    if (!key) {
      left[t.transfer_type].nameless += t.amount;
      continue;
    }
    const tags = tagsOf(key);
    if (!tags.size) left[t.transfer_type].unlabelled += t.amount;
    for (const tag of tags) sums[t.transfer_type].set(tag, (sums[t.transfer_type].get(tag) || 0) + t.amount);
  }
  const both = (tag) => (sums.debit.get(tag) || 0) + (sums.credit.get(tag) || 0);
  const ranked = [...new Set([...sums.debit.keys(), ...sums.credit.keys()])].sort((a, b) => both(b) - both(a));
  const color = new Map(ranked.map((tag, i) => [tag, PIE_COLORS[i % PIE_COLORS.length]]));
  const card = (title, type) => {
    const slices = [...sums[type]].sort((a, b) => b[1] - a[1]);
    const total = slices.reduce((s, [, v]) => s + v, 0);
    const notes = [];
    if (left[type].unlabelled) notes.push(`<a class="link" href="#/label">${naira(left[type].unlabelled)} not labelled yet</a>`);
    if (left[type].nameless) notes.push(`${naira(left[type].nameless)} with no name on the statement`);
    const body = total
      ? `<div class="pie-body">${pieSvg(slices.map(([tag, v]) => [v, color.get(tag)]))}
          <ul class="pie-legend">${slices
            .map(([tag, v]) => `<li><a href="#/tag/${enc(tag)}"><i style="background:${color.get(tag)}"></i><span class="tg">${esc(tag)}</span><span class="v">${naira(v)} · ${percent(v, total)}</span></a></li>`)
            .join('')}</ul></div>`
      : `<p class="empty-note" style="padding-top:0">No tagged money ${type === 'credit' ? 'in' : 'out'} yet.</p>`;
    return `<section class="card"><h2 class="sect"><span>${title}</span></h2>${body}${notes.length ? `<p class="pie-note">${notes.join(' · ')}</p>` : ''}</section>`;
  };
  return card('Debits by tag — money out', 'debit') + card('Credits by tag — money in', 'credit');
}

// Each year with any transfers, newest first, with the banks it came from.
function yearList(banks) {
  const per = new Map();
  for (const t of data.transfers) {
    const y = t.created_at.slice(0, 4);
    if (!per.has(y)) per.set(y, new Set());
    per.get(y).add(bankOf(t));
  }
  const years = [...per.keys()].sort().reverse();
  if (!years.length) return '';
  return `<div class="ylist"><div class="ylist-label">Available years</div>${years
    .map((y) => `<div class="ylist-row"><button type="button" data-scroll="${y}">${y}</button><span class="ylist-banks">${banks
      .filter((b) => per.get(y).has(b))
      .map((b) => `<span><i style="background:${bankVar(b)}"></i>${esc(bankLabel(b))}</span>`)
      .join('')}</span></div>`)
    .join('')}</div>`;
}

// One card per year: money in by month, stacked by bank, all on one scale so
// years compare. A month's average counts only months with money in.
function yearCharts(banks) {
  const years = new Map();
  const yearOf = (y) => {
    if (!years.has(y)) years.set(y, { months: Array.from({ length: 12 }, () => ({ total: 0, by: new Map() })), charges: 0, chargeCount: 0 });
    return years.get(y);
  };
  for (const t of data.transfers) {
    const yr = yearOf(t.created_at.slice(0, 4));
    if (t.transfer_category === 'charge') {
      yr.charges += t.amount;
      yr.chargeCount++;
    }
    if (t.transfer_type !== 'credit') continue;
    const m = yr.months[+t.created_at.slice(5, 7) - 1];
    m.by.set(bankOf(t), (m.by.get(bankOf(t)) || 0) + t.amount);
    m.total += t.amount;
  }
  const list = [...years].sort((a, b) => b[0].localeCompare(a[0]));
  const max = Math.max(1, ...list.flatMap(([, yr]) => yr.months.map((m) => m.total)));
  const avg = (yr) => {
    const active = yr.months.filter((m) => m.total > 0);
    return active.length ? active.reduce((s, m) => s + m.total, 0) / active.length : 0;
  };
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((k) => k * max);
  const pos = (v) => (100 - (v / max) * 100).toFixed(2);
  return list
    .map(([y, yr], i) => {
      const total = yr.months.reduce((s, m) => s + m.total, 0);
      const a = avg(yr);
      const prev = list[i + 1];
      const pa = prev ? avg(prev[1]) : 0;
      const pct = pa ? ((a - pa) / pa) * 100 : null;
      const bars = yr.months
        .map((m, k) => {
          let below = 0;
          const parts = banks.filter((b) => m.by.get(b)).map((b) => [b, m.by.get(b)]);
          const segs = parts
            .map(([b, v]) => {
              below += v;
              return `<rect class="bar" x="${k * 100 + 20}" y="${pos(below)}" width="60" height="${((v / max) * 100).toFixed(3)}" style="fill:${bankVar(b)}"/>`;
            })
            .join('');
          const ym = `${y}-${pad2(k + 1)}`;
          return `<a class="ym" href="#/month/${ym}" data-ym="${ym}" data-total="${m.total}" data-by="${esc(JSON.stringify(parts))}" aria-label="${MONTHS[k]} ${y}: ${naira(m.total)} in"><rect class="hit" x="${k * 100}" y="0" width="100" height="100"/>${segs}</a>`;
        })
        .join('');
      return `<section class="card yblock" id="year-${y}">
        <div class="yhead">
          <h3>${y}</h3>
          <div class="ystats">
            <span class="ystat${pct === null ? '' : pct >= 0 ? ' ok' : ' bad'}">Monthly avg: <strong>${naira(a)}</strong>${pct === null ? '' : `<span class="ydelta"><b>${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}%</b> vs ${prev[0]}</span>`}</span>
            <span class="ystat">Total credits: <strong>${naira(total)}</strong></span>
            ${yr.chargeCount ? `<span class="ystat">Charges: <strong>${naira(yr.charges)}</strong> (${yr.chargeCount.toLocaleString()})</span>` : ''}
          </div>
        </div>
        <div class="ychart">
          <div class="yaxis" aria-hidden="true">${ticks.map((v) => `<span style="top:${pos(v)}%">${compact(v, 2)}</span>`).join('')}</div>
          <div class="yplot">
            <div class="ybox">${ticks.map((v) => `<i class="gl" style="top:${pos(v)}%"></i>`).join('')}
              <svg viewBox="0 0 1200 100" preserveAspectRatio="none" role="group" aria-label="Money in by month, ${y}">${bars}</svg>
            </div>
            <div class="ymonths" aria-hidden="true">${MON.map((mn) => `<span>${mn}</span>`).join('')}</div>
          </div>
          <div class="ytip" hidden></div>
        </div>
      </section>`;
    })
    .join('');
}

function tagBars(rows, type) {
  const totals = new Map();
  let unlabelled = 0;
  let nameless = 0;
  let total = 0;
  for (const t of rows) {
    if (t.transfer_type !== type || t.transfer_category === 'charge') continue;
    total += t.amount;
    const key = partyKeyOf(t);
    if (!key) {
      nameless += t.amount;
      continue;
    }
    const tags = tagsOf(key);
    if (!tags.size) unlabelled += t.amount;
    for (const tag of tags) totals.set(tag, (totals.get(tag) || 0) + t.amount);
  }
  if (!total) return `<p class="empty-note">No money ${type === 'credit' ? 'in' : 'out'} here.</p>`;
  const sorted = [...totals].sort((a, b) => b[1] - a[1]);
  const items = sorted.slice(0, 8).map(([tag, v]) => ({ name: tag, v, href: `#/tag/${enc(tag)}` }));
  const rest = sorted.slice(8);
  if (rest.length) items.push({ name: `${rest.length} more tags`, v: rest.reduce((s, x) => s + x[1], 0), href: '#/tags', rest: true });
  if (unlabelled) items.push({ name: 'Not labelled yet', v: unlabelled, href: '#/label', rest: true });
  // GTBank and Chipper statements don't name the other side, so there's no one to tag.
  if (nameless) items.push({ name: 'No name given', v: nameless, rest: true });
  const max = Math.max(...items.map((i) => i.v));
  const cls = type === 'credit' ? 'in' : 'out';
  return `<ul class="hbars">${items
    .map((i) => {
      const inner = `<span class="hb-name">${esc(i.name)}</span>
        <span class="hb-track"><span class="hb-bar ${i.rest ? 'rest' : cls}" style="width:${((i.v / max) * 100).toFixed(2)}%"></span></span>
        <span class="hb-val">${compact(i.v)}</span>
        <span class="hb-pct">${percent(i.v, total)}</span>`;
      const title = `${esc(i.name)}: ${naira(i.v)}`;
      return `<li class="${i.rest ? 'muted-row' : ''}">${i.href ? `<a href="${i.href}" title="${title}">${inner}</a>` : `<div class="hb-row" title="${title}">${inner}</div>`}</li>`;
    })
    .join('')}</ul>`;
}

function topPeople(rows, type, limit = 8) {
  const sums = new Map();
  for (const t of rows) {
    if (t.transfer_type !== type || t.transfer_category === 'charge') continue;
    const key = partyKeyOf(t);
    if (!key) continue;
    const e = sums.get(key) || { v: 0, n: 0 };
    e.v += t.amount;
    e.n++;
    sums.set(key, e);
  }
  const list = [...sums].sort((a, b) => b[1].v - a[1].v).slice(0, limit);
  if (!list.length) return '<p class="empty-note">No one yet.</p>';
  return `<ol class="rows">${list
    .map(([key, e], i) => {
      const p = ix.parties.get(key);
      return `<li class="prow" data-party="${esc(key)}">
        <span class="rank">${i + 1}</span>
        <div><a class="name" href="#/party/${enc(key)}">${esc(displayName(p))}</a><div class="meta">${plural(e.n, 'transfer')}</div></div>
        <div class="tags">${tagCell(key)}</div>
        <span class="amt ${type === 'credit' ? 'in' : ''}">${type === 'credit' ? '+' : '−'}${naira(e.v)}</span>
      </li>`;
    })
    .join('')}</ol>`;
}

// Year chart tooltip: the month, each bank's money in, the total. The other
// months fade while one is pointed at or focused.
function showYearTip(ym) {
  const chart = ym.closest('.ychart');
  const box = chart.querySelector('.ytip');
  chart.classList.add('hovering');
  chart.querySelectorAll('.ym.on').forEach((x) => x.classList.remove('on'));
  ym.classList.add('on');
  const line = (text, cls = '') => {
    const s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = text;
    box.append(s);
    return s;
  };
  box.replaceChildren();
  const head = document.createElement('strong');
  head.textContent = fmtMonth(ym.dataset.ym);
  box.append(head);
  const parts = JSON.parse(ym.dataset.by || '[]');
  if (!parts.length) line('No money in');
  for (const [bank, v] of parts) {
    const key = document.createElement('i');
    key.style.background = bankVar(bank);
    line(`${bankLabel(bank)}: ${naira(v)}`).prepend(key);
  }
  line(`Total: ${naira(+ym.dataset.total)}`, 'tot');
  box.hidden = false;
}
function hideYearTip(chart) {
  chart.classList.remove('hovering');
  chart.querySelectorAll('.ym.on').forEach((x) => x.classList.remove('on'));
  chart.querySelector('.ytip').hidden = true;
}

function partyMatches(p, q) {
  if (!q) return true;
  if (p.acct && p.acct.includes(q)) return true;
  if (displayName(p)?.toLowerCase().includes(q)) return true;
  if (p.bank && p.bank.toLowerCase().includes(q)) return true;
  for (const n of p.names.keys()) if (n.toLowerCase().includes(q)) return true;
  return false;
}

const dirTotal = (p) => (prefs.dir === 'out' ? p.out : prefs.dir === 'in' ? p.in : p.out + p.in);

// The list is a snapshot: someone you tag while looking at "Untagged" stays put
// until you change the filter, so you can see what you just did.
function computeLabelKeys() {
  const q = labelState.q.trim().toLowerCase();
  const list = labelable().filter((p) => {
    const tagged = tagsOf(p.key).size > 0;
    if (prefs.show === 'untagged' && tagged) return false;
    if (prefs.show === 'tagged' && !tagged) return false;
    if (prefs.dir === 'out' && !p.out) return false;
    if (prefs.dir === 'in' && !p.in) return false;
    return partyMatches(p, q);
  });
  const sorters = {
    total: (a, b) => dirTotal(b) - dirTotal(a),
    count: (a, b) => b.count - a.count || dirTotal(b) - dirTotal(a),
    recent: (a, b) => (b.last > a.last ? 1 : b.last < a.last ? -1 : 0),
    name: (a, b) => displayName(a).localeCompare(displayName(b)),
  };
  list.sort(sorters[prefs.sort] || sorters.total);
  labelState.keys = list.map((p) => p.key);
}

function paintLabelSeg() {
  const all = labelable();

}

function paintLabelProgress() {

}

function partyRow(p) {
  if (!p) return '';

// Long lists render in chunks as you scroll.
function mountChunks(list, more, items, render, noun) {
  if (listObserver) listObserver.disconnect();
  const STEP = 60;
  let shown = 0;
  list.innerHTML = '';
  const step = () => {
    list.insertAdjacentHTML('beforeend', items.slice(shown, shown + STEP).map(render).join(''));
    shown = Math.min(items.length, shown + STEP);
    more.textContent = shown < items.length ? `Showing ${shown.toLocaleString()} of ${items.length.toLocaleString()} ${noun}…` : '';
  };
  step();
  if (shown >= items.length) return;
  listObserver = new IntersectionObserver(
    (entries) => {
      if (!entries.some((en) => en.isIntersecting)) return;
      step();
      if (shown >= items.length) listObserver.disconnect();
    },
    { rootMargin: '600px' }
  );
  listObserver.observe(more);
}

const listState = { rows: [], q: '', type: '', sort: 'new', search: false, source: true, party: null };

function listShell({ search = false } = {}) {

function mountList(rows, opts = {}) {
  listState.rows = rows;
  listState.search = !!opts.search;
  listState.source = data.accounts.length > 1 && !opts.oneBank;
  listState.party = opts.party || null;

    listState.type = '';
    listState.sort = 'new';
    if (!opts.search) listState.q = '';
  }
  $('tx-type').value = listState.type;
  $('tx-sort').value = listState.sort;

function txMatches(t, q) {
  if (!q) return true;
  if (t.remarks && t.remarks.toLowerCase().includes(q)) return true;
  if (t.account_name && t.account_name.toLowerCase().includes(q)) return true;
  if (t.account_number && t.account_number.includes(q)) return true;
  if (t.bank_name && t.bank_name.toLowerCase().includes(q)) return true;
  const named = t.account_number && data.names[t.account_number];
  return !!named && named.toLowerCase().includes(q);
}

function renderTxList() {
  const q = listState.search ? listState.q.trim().toLowerCase() : '';
  let rows = listState.rows.filter((t) => (!listState.type || t.transfer_type === listState.type) && txMatches(t, q));
  const by = {
    new: (a, b) => (a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : b.id - a.id),
    old: (a, b) => (a.created_at > b.created_at ? 1 : a.created_at < b.created_at ? -1 : a.id - b.id),
    big: (a, b) => b.amount - a.amount,
    small: (a, b) => a.amount - b.amount,
  };
  rows = [...rows].sort(by[listState.sort] || by.new);
  const s = totalsOf(rows);
  $('tx-summary').innerHTML = rows.length
    ? `<span>${plural(rows.length, 'transfer')}${s.first ? ` · ${esc(fmtRange(s.first, s.last))}` : ''}</span>
       ${s.in ? `<span>In <b class="in">+${naira(s.in)}</b></span>` : ''}
       ${s.out ? `<span>Out <b>−${naira(s.out)}</b></span>` : ''}`
    : '';
  if (!rows.length) {
    $('tx-list').innerHTML = '';
    $('tx-more').textContent = q ? 'Nothing matches that search.' : 'No transfers here.';
    return;
  }
  mountChunks($('tx-list'), $('tx-more'), rows, txRow, 'transfers');
}

function txRow(t) {
  const key = partyKeyOf(t);
  const p = key && ix.parties.get(key);
  const charge = t.transfer_category === 'charge';
  const who = p
    ? `<a class="name" href="#/party/${enc(key)}">${esc(displayName(p))}</a>`
    : `<span class="name none">${charge ? 'Bank charge' : 'No name on the statement'}</span>`;
  const meta = [t.account_number && (!p || displayName(p) !== t.account_number) ? `<span class="mono">${t.account_number}</span>` : '', t.bank_name ? esc(t.bank_name) : ''].filter(Boolean).join(' · ');
  const acct = ix.accounts.get(t.account_id);
  const time = fmtTime(t.created_at);
  // On a person's own page their name, account and tags are in the header.
  const own = key && key === listState.party;
  return `<li class="tx${charge ? ' charge' : ''}"${key ? ` data-party="${esc(key)}"` : ''}>
    <div class="when"><a href="#/day/${t.created_at.slice(0, 10)}" title="Everything on ${fmtDate(t.created_at)}">${fmtDate(t.created_at)}</a>${time ? `<span>${time}</span>` : ''}</div>

      ${t.remarks ? `<div class="remarks" title="Show all">${esc(t.remarks)}</div>` : ''}

}

    <header class="view-head">
      <h2>Tags</h2>
      <p class="lede">Each tag and the people under it. Tags are kept when you delete transfers, and apply again to anything you import later.${waiting ? ` ${plural(waiting, 'tag')} ${waiting === 1 ? 'is' : 'are'} waiting for people you haven’t imported yet.` : ''}</p>
    </header>
    ${
      list.length
        ? list
            .map(
              (g) => `<section class="card tg-group">
      <div class="tg-head">
        <span class="chip solo"><a href="#/tag/${enc(g.tag)}">${esc(g.tag)}</a></span>
        <span class="meta">${plural(g.people.length, 'person', 'people')} · ${plural(g.n, 'transfer')}</span>
        <span class="sums" style="flex-direction:row;gap:12px">${g.out ? `<span class="amt">−${naira(g.out)}</span>` : ''}${g.in ? `<span class="amt in">+${naira(g.in)}</span>` : ''}</span>
        <button type="button" class="btn small" data-act="drop-tag" data-tag="${esc(g.tag)}">Remove tag</button>
      </div>
      <ul class="rows" style="margin-top:8px">${g.people
        .sort((a, b) => b.out + b.in - (a.out + a.in))
        .slice(0, openTags.has(g.tag) ? Infinity : TAG_PREVIEW)
        .map(
          (p) => `<li class="prow norank" data-party="${esc(p.key)}">
          <div><a class="name" href="#/party/${enc(p.key)}">${esc(displayName(p))}</a><div class="meta">${[p.acct ? `<span class="mono">${p.acct}</span>` : '', plural(p.count, 'transfer')].filter(Boolean).join(' · ')}</div></div>
          <div class="tags"><span class="chip"><a href="#/tag/${enc(g.tag)}">${esc(g.tag)}</a><button type="button" data-act="untag" data-tag="${esc(g.tag)}" aria-label="Remove ${esc(displayName(p))} from ${esc(g.tag)}" title="Remove">×</button></span></div>
          <div class="sums">${p.out ? `<span class="amt">−${naira(p.out)}</span>` : ''}${p.in ? `<span class="amt in">+${naira(p.in)}</span>` : ''}</div>
        </li>`
        )
        .join('')}</ul>
      ${g.people.length > TAG_PREVIEW ? `<button type="button" class="btn small" style="margin-top:10px" data-act="tag-all" data-tag="${esc(g.tag)}">${openTags.has(g.tag) ? 'Show fewer' : `Show all ${g.people.length.toLocaleString()} people`}</button>` : ''}
    </section>`
            )
            .join('')
        : `<section class="card"><p class="empty-note" style="padding-top:4px">${
            waiting
              ? 'Your tags show here once you import statements with the people they’re for.'
              : `No tags yet. ${data.transfers.length ? '<a class="link" href="#/label">Start labelling →</a>' : 'Import a statement first.'}`
          }</p></section>`
    }`;
}

// ---------- Banks & data ----------

function viewBanks() {
  const stats = new Map(data.accounts.map((a) => [a.id, { ...totalsOf([]), latest: null }]));
  for (const t of data.transfers) {
    const s = stats.get(t.account_id);
    if (!s) continue;
    s.count++;
    if (t.transfer_type === 'credit') s.in += t.amount;
    else s.out += t.amount;
    if (!s.first || t.created_at < s.first) s.first = t.created_at;
    if (!s.latest || t.created_at > s.latest.created_at || (t.created_at === s.latest.created_at && t.id > s.latest.id)) s.latest = t;
  }
  view.innerHTML = `
    <header class="view-head"><h2>Banks</h2><p class="lede">One account per bank, built from every statement you’ve imported for it.</p></header>
    <section class="card">
      ${
        data.accounts.length
          ? `<ul class="banks">${data.accounts
              .map((a) => {
                const s = stats.get(a.id);
                return `<li class="bank">
          <div>
            <a class="name" href="#/bank/${a.id}">${bankDot(a.bank_name)}${esc(bankLabel(a.bank_name))}</a>
            <div class="meta">${plural(s.count, 'transfer')}${s.first ? ` · ${esc(fmtRange(s.first, s.latest.created_at))}` : ''}${s.latest ? ` · balance ${naira(s.latest.balance_after)} on ${fmtDate(s.latest.created_at)}` : ''}</div>
          </div>
          <div class="acts"><a class="btn small" href="#/bank/${a.id}">Transfers</a><button type="button" class="btn small danger" data-act="drop-bank" data-id="${a.id}">Remove…</button></div>
        </li>`;
              })
              .join('')}</ul>`
          : '<p class="empty-note" style="padding-top:4px">No banks yet. Import a statement to add one.</p>'
      }
    </section>
    <section class="card">
      <h2 class="sect"><span>Your data</span></h2>
      <p class="muted" style="margin:0;font-size:14px">Everything is stored in this browser only. Download a backup to move it to another device or keep it safe; import the file (or drop it here) to restore.</p>
      <div class="data-acts">
        <button type="button" class="btn primary" data-act="pick">Import statements</button>
        <button type="button" class="btn" data-act="export">Download backup</button>
        <label class="btn" for="file-input">Restore a backup</label>
        <button type="button" class="btn danger" data-act="wipe" ${data.transfers.length ? '' : 'disabled'}>Delete all transfers…</button>
        <button type="button" class="btn danger" data-act="erase">Erase everything…</button>
      </div>
      ${
        data.imports.length
          ? `<h2 class="sect" style="margin-top:22px"><span>Imported</span></h2><ul class="history">${data.imports
              .slice(0, 30)
              .map((h) => `<li><span>${esc(h.file)}</span><span class="muted">${esc(bankLabel(h.bank))} · ${plural(h.inserted, 'new transfer')}${h.skipped ? ` · ${h.skipped.toLocaleString()} skipped` : ''} · ${fmtDate(h.at.slice(0, 10))}</span></li>`)
              .join('')}</ul>`
          : ''
      }
    </section>`;
}

function viewBank(id) {
  const a = ix.accounts.get(+id);
  if (!a) return notFound('That bank isn’t here any more.');
  const rows = data.transfers.filter((t) => t.account_id === a.id);
  view.innerHTML = `
    <header class="view-head">
      <p class="crumbs"><a href="#/banks">Banks</a></p>
      <h2>${bankDot(a.bank_name)}${esc(bankLabel(a.bank_name))}</h2>
    </header>
    ${listShell({ search: true })}`;
  mountList(rows, { search: true, oneBank: true });
}

function notFound(message) {
  view.innerHTML = `<section class="card"><p class="empty-note" style="padding-top:4px">${esc(message)} <a class="link" href="#/">Back to the overview</a></p></section>`;
}

// ---------- Row actions ----------

view.addEventListener('click', (e) => {
  const remarks = e.target.closest('.remarks');
  if (remarks) {
    remarks.classList.toggle('open');
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const key = btn.closest('[data-party]')?.dataset.party;
  const act = btn.dataset.act;
  if (act === 'tag' && key) {
    if (!picker.hidden && pick.anchor === btn) closePicker();
    else openPicker(btn, key);
  }
  else if (act === 'untag' && key) removeTag(key, btn.dataset.tag);
  else if (act === 'export') exportBackup();
  else if (act === 'pick') {
    loadPdfjs().catch(() => {});
    $('file-input').click();
  }
  else if (act === 'tag-all') {
    const tag = btn.dataset.tag;
    if (openTags.has(tag)) openTags.delete(tag);
    else openTags.add(tag);
    route();
  }
  else if (act === 'drop-tag') {
    const tag = btn.dataset.tag;
    confirmAction(`Remove “${tag}”?`, 'It comes off everyone tagged with it. The tag stays in the list for later.', 'Remove tag', () => {
      data.tags = data.tags.filter((m) => m.tag !== tag);
      resolveTags();
      save();
      route();
      paintLabelCount();
    });
  } else if (act === 'drop-bank') {
    const a = ix.accounts.get(+btn.dataset.id);
    if (!a) return;
    const n = data.transfers.filter((t) => t.account_id === a.id).length;
    confirmAction(`Remove ${bankLabel(a.bank_name)}?`, `This deletes its ${plural(n, 'transfer')} from this browser. Your tags stay, and come back if you import its statements again.`, 'Remove bank', () => {
      data.transfers = data.transfers.filter((t) => t.account_id !== a.id);
      data.accounts = data.accounts.filter((x) => x.id !== a.id);
      buildIndex();
      save(true);
      route();
      toast(`Removed ${bankLabel(a.bank_name)}.`);
    });
  } else if (act === 'wipe') {
    confirmAction('Delete all transfers?', `This deletes ${plural(data.transfers.length, 'transfer')} from this browser. Tags and names stay for when you import again. Download a backup first if you might want them back.`, 'Delete transfers', () => {
      data.transfers = [];
      data.accounts = [];
      data.imports = [];
      buildIndex();
      save(true);
      route();
      toast('All transfers deleted. Your tags are still here.');
    });
  } else if (act === 'erase') {
    confirmAction('Erase everything?', 'Transfers, tags, names and import history are all deleted from this browser. This can’t be undone.', 'Erase everything', async () => {
      data = freshData();
      buildIndex();
      try {
        await kv.clear();
      } catch {}
      route();
      toast('Everything has been erased.');
    });
  }
});

// ---------- Tag picker ----------

const picker = $('picker');
const pickerQ = $('picker-q');
const pick = { anchor: null, key: null, active: 0, options: [], viaKeys: false };

function openPicker(anchor, key) {
  pick.anchor = anchor;
  pick.key = key;
  pick.active = 0;
  pick.viaKeys = false;
  pickerQ.value = '';
  picker.hidden = false;
  renderPicker();
  placePicker();
  pickerQ.focus({ preventScroll: true });
}

function closePicker(restoreFocus = false) {
  if (picker.hidden) return;
  picker.hidden = true;
  if (restoreFocus && pick.anchor?.isConnected) pick.anchor.focus({ preventScroll: true });
}

function placePicker() {
  const small = innerWidth <= 720;
  picker.classList.toggle('sheet', small);
  if (small) return;
  const r = pick.anchor.getBoundingClientRect();
  const w = picker.offsetWidth;
  const h = picker.offsetHeight;
  const left = Math.min(Math.max(8, r.right - w), innerWidth - w - 8) + scrollX;
  const below = r.bottom + 6 + h < innerHeight;
  picker.style.left = left + 'px';
  picker.style.top = (below ? r.bottom + 6 : r.top - h - 6) + scrollY + 'px';
}

function pickerOptions() {
  const applied = tagsOf(pick.key);
  const q = pickerQ.value.trim().toLowerCase().replace(/\s+/g, ' ');
  const all = [...data.tagList].sort((a, b) => a.localeCompare(b));
  let options;
  if (q) {
    options = all
      .filter((t) => t.includes(q))
      .sort((a, b) => Number(b.startsWith(q)) - Number(a.startsWith(q)) || a.localeCompare(b))
      .map((tag) => ({ tag }));
    if (!data.tagList.includes(q)) options.push({ tag: q.slice(0, 40), create: true });
  } else {
    const recent = data.recent.filter((t) => data.tagList.includes(t));
    options = [
      ...(recent.length ? [{ group: 'Recent' }] : []),
      ...recent.map((tag) => ({ tag })),
      ...(recent.length ? [{ group: 'All tags' }] : []),
      ...all.filter((t) => !recent.includes(t)).map((tag) => ({ tag })),
    ];
  }
  return options.map((o) => (o.tag ? { ...o, on: applied.has(o.tag) } : o));
}

function renderPicker() {
  pick.options = pickerOptions();
  const choices = pick.options.filter((o) => o.tag);
  pick.active = Math.min(pick.active, Math.max(0, choices.length - 1));
  let i = -1;
  $('picker-list').innerHTML = pick.options
    .map((o) => {
      if (o.group) return `<li class="group" role="presentation">${o.group}</li>`;
      i++;
      return `<li role="option" id="pk-${i}" data-i="${i}" class="${i === pick.active ? 'active' : ''}" aria-selected="${o.on}">
        <span class="ck" aria-hidden="true">${o.on ? '✓' : ''}</span>${esc(o.tag)}${o.create ? '<em>new tag</em>' : o.on ? '<em>remove</em>' : ''}
      </li>`;
    })
    .join('');
  pickerQ.setAttribute('aria-activedescendant', choices.length ? `pk-${pick.active}` : '');
  // Keep the active option in view by scrolling the list only, never the page.
  const li = $(`pk-${pick.active}`);
  const ul = $('picker-list');
  if (li) {
    const top = li.offsetTop - ul.offsetTop;
    if (top < ul.scrollTop) ul.scrollTop = top;
    else if (top + li.offsetHeight > ul.scrollTop + ul.clientHeight) ul.scrollTop = top + li.offsetHeight - ul.clientHeight;
  }
}

function choose(index) {
  const choice = pick.options.filter((o) => o.tag)[index];
  if (!choice) return;
  const { key, anchor, viaKeys } = pick;
  const row = anchor.closest('[data-party]');
  const next = row?.nextElementSibling?.querySelector('[data-act="tag"]');
  closePicker();
  if (choice.on) removeTag(key, choice.tag);
  else addTag(key, choice.tag);
  if (row) {
    row.classList.add('just-tagged');
    setTimeout(() => row.classList.remove('just-tagged'), 900);
  }
  // From the keyboard, move straight on to the next person.
  if (viaKeys && !choice.on && current.view === 'label' && next?.isConnected) next.focus();
  else row?.querySelector('[data-act="tag"]')?.focus({ preventScroll: true });
}

pickerQ.addEventListener('input', () => {
  pick.active = 0;
  renderPicker();
});
pickerQ.addEventListener('keydown', (e) => {
  const n = pick.options.filter((o) => o.tag).length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!n) return;
    pick.active = (pick.active + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
    renderPicker();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    pick.viaKeys = true;
    choose(pick.active);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closePicker(true);
  } else if (e.key === 'Tab') {
    closePicker(true);
    e.preventDefault();
  }
});
$('picker-list').addEventListener('click', (e) => {
  const li = e.target.closest('[data-i]');
  if (li) choose(+li.dataset.i);
});
document.addEventListener('pointerdown', (e) => {
  if (!picker.hidden && !picker.contains(e.target) && e.target.closest('[data-act="tag"]') !== pick.anchor) closePicker();
});
// A phone's keyboard opening resizes the window's height only; keep the picker
// open for that.
let lastWidth = innerWidth;
addEventListener('resize', () => {
  if (innerWidth !== lastWidth) closePicker();
  lastWidth = innerWidth;
});

// ---------- Confirm & toast ----------

const confirmDialog = $('confirm');
let onConfirm = null;
function confirmAction(title, text, yesLabel, fn) {
  $('confirm-title').textContent = title;
  $('confirm-text').textContent = text;
  $('confirm-yes').textContent = yesLabel;
  onConfirm = fn;
  confirmDialog.showModal();
  $('confirm-no').focus();
}
$('confirm-no').addEventListener('click', () => confirmDialog.close());
$('confirm-yes').addEventListener('click', () => {
  const fn = onConfirm;
  onConfirm = null;
  confirmDialog.close();
  fn?.();
});

let toastTimer;
function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), 3600);
}

// ---------- Files in ----------

$('file-input').addEventListener('change', (e) => {
  addFiles(e.target.files);
  e.target.value = '';
});

let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  $('dropzone').hidden = false;
});
addEventListener('dragover', (e) => {
  if (hasFiles(e)) e.preventDefault();
});
addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) $('dropzone').hidden = true;
});
addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('dropzone').hidden = true;
  addFiles(e.dataTransfer.files);
});
addEventListener('beforeunload', (e) => {
  if (importing) e.preventDefault();
});

// "/" jumps to the search box.
addEventListener('keydown', (e) => {
  if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  const box = $('label-q') || $('tx-q');
  if (box) {
    e.preventDefault();
    box.focus();
  }
});

// ---------- Light / dark ----------

const root = document.documentElement;
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : darkQuery.matches);
function paintThemeButton() {
  const dark = isDark();
  const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
  $('theme-btn').innerHTML = dark ? ICONS.sun : ICONS.moon;
  $('theme-btn').setAttribute('aria-label', label);
  $('theme-btn').title = label;
}
$('theme-btn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  root.dataset.theme = next;
  try {
    localStorage.setItem(THEME_KEY, next);
  } catch {}
  paintThemeButton();
});
darkQuery.addEventListener('change', paintThemeButton);

// ---------- Hide figures ----------
// For looking at the page where others can see the screen. Remembered, and
// read before the first render, so hidden figures never flash up on load.

function paintFiguresButton() {
  const hidden = !!prefs.hideFigures;
  const label = hidden ? 'Show figures' : 'Hide figures';
  $('figures-btn').innerHTML = hidden ? ICONS.eye : ICONS.eyeOff;
  $('figures-btn').setAttribute('aria-label', label);
  $('figures-btn').title = label;
}
$('figures-btn').addEventListener('click', () => {
  prefs.hideFigures = !prefs.hideFigures;
  savePrefs();
  paintFiguresButton();
  route();
});

// ---------- Start ----------

addEventListener('hashchange', route);
paintThemeButton();
paintFiguresButton();
load().then(() => {
  buildIndex();
  route();
});
</script>
