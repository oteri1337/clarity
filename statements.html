<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statements</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bd1'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5.75 12.25L16 6.5l10.25 5.75z'/%3E%3Cpath d='M10 15.25v6.25M16 15.25v6.25M22 15.25v6.25M6.25 25h19.5'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@300..700&display=swap">
<style>
/* Layout: header (name, tabs, import / backup / theme), then one view at a time.
   Views: Overview (charts), Label (people to tag), Transfers, Tags, Banks, plus
   drill-downs for a person, tag, month, day or bank. */
:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --soft: #f1f5f9;
  --hover: #f8fafc;
  --ink: #0f172a;
  --ink-soft: #475569;
  --muted: #64748b;
  --faint: #94a3b8;
  --rule: #e2e8f0;
  --rule-strong: #cbd5e1;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --in: #16a34a;
  --in-mark: #16a34a;
  --out-mark: #ea580c;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --danger-line: #fecaca;
  --on-danger: #ffffff;
  --chip: #f1f5f9;
  --shadow: 0 1px 2px rgb(15 23 42 / 0.05), 0 12px 32px rgb(15 23 42 / 0.12);
  --bank-gtbank: #c2410c;
  --bank-kuda: #7c3aed;
  --bank-moniepoint: #2563eb;
  --bank-alat: #dc2626;
  --bank-barter: #eab308;
  --bank-opay: #10b981;
  --bank-chipper: #111827;
  --sans: 'Signika Negative', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: var(--sans);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0f172a;
    --surface: #1e293b;
    --soft: #334155;
    --hover: #243044;
    --ink: #f1f5f9;
    --ink-soft: #cbd5e1;
    --muted: #94a3b8;
    --faint: #64748b;
    --rule: #334155;
    --rule-strong: #475569;
    --accent: #60a5fa;
    --accent-soft: #172554;
    --in: #4ade80;
    --in-mark: #22c55e;
    --out-mark: #fb923c;
    --danger: #f87171;
    --danger-soft: #3b1414;
    --danger-line: #7f1d1d;
    --on-danger: #0f172a;
    --chip: #334155;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.5);
    --bank-gtbank: #f97316;
    --bank-kuda: #a78bfa;
    --bank-moniepoint: #60a5fa;
    --bank-alat: #f87171;
    --bank-barter: #facc15;
    --bank-opay: #34d399;
    --bank-chipper: #e2e8f0;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0f172a;
  --surface: #1e293b;
  --soft: #334155;
  --hover: #243044;
  --ink: #f1f5f9;
  --ink-soft: #cbd5e1;
  --muted: #94a3b8;
  --faint: #64748b;
  --rule: #334155;
  --rule-strong: #475569;
  --accent: #60a5fa;
  --accent-soft: #172554;
  --in: #4ade80;
  --in-mark: #22c55e;
  --out-mark: #fb923c;
  --danger: #f87171;
  --danger-soft: #3b1414;
  --danger-line: #7f1d1d;
  --on-danger: #0f172a;
  --chip: #334155;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.5);
  --bank-gtbank: #f97316;
  --bank-kuda: #a78bfa;
  --bank-moniepoint: #60a5fa;
  --bank-alat: #f87171;
  --bank-barter: #facc15;
  --bank-opay: #34d399;
  --bank-chipper: #e2e8f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.4 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.shell { padding: 28px 28px 96px; }

/* ---- top bar: name on the left, views and tools on the right ---- */
.nav {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 32px;
  padding: 22px 40px; background: var(--bg); border-bottom: 1px solid var(--rule);
}
.brand { font-weight: 700; font-size: 19px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.tabs { margin-left: auto; display: flex; align-items: center; gap: 28px; overflow-x: auto; scrollbar-width: none; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current='page'] { color: var(--ink); font-weight: 600; }
.badge {
  min-width: 18px; height: 17px; padding: 0 5px; border-radius: 9px;
  background: var(--accent); color: #fff;
  font: 600 10.5px/17px var(--sans); text-align: center; font-variant-numeric: tabular-nums;
}
.tools { display: flex; align-items: center; gap: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap;
  transition: background-color 0.12s, border-color 0.12s, color 0.12s;
}
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--ink); opacity: 0.9; }
.btn.quiet { color: var(--muted); }
.btn.quiet:hover { color: var(--ink); }
.btn.danger { color: var(--danger); border-color: var(--danger-line); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.btn.danger-solid:hover { opacity: 0.9; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.icon-btn {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 6px; background: none; color: var(--muted);
  transition: color 0.12s, background-color 0.12s;
}
.icon-btn:hover { color: var(--ink); background: var(--soft); }

/* ---- generic blocks ---- */
.view { margin-top: 0; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.view > * + * { margin-top: 16px; }
.sect {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px;
  margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--ink);
}
.sect .n { color: var(--muted); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.view-head { margin-bottom: 20px; }
.view-head h2 { margin: 0; font: 600 22px/1.2 var(--sans); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.view-head .lede { margin: 6px 0 0; color: var(--ink-soft); max-width: 640px; }
.view-head .crumbs { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.view-head .crumbs a { color: var(--muted); }
.subline { margin-top: 6px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.empty-note { padding: 22px 0 8px; color: var(--muted); font-size: 14px; }
.amt { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--in); }
.link { color: var(--accent); text-decoration: none; font-weight: 500; }
.link:hover { text-decoration: underline; }

.bank-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; flex: none; }

/* ---- segmented filters ---- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--soft); font-size: 13px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button {
  height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--ink-soft); white-space: nowrap;
  transition: background-color 0.12s, color 0.12s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.07); }
.seg .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.search {
  flex: 1 1 220px; min-width: 0; height: 34px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); font-size: 14px;
}
.search::placeholder { color: var(--faint); }
select.sel { height: 34px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); font-size: 13px; }

/* ---- empty state ---- */
.hero { padding: 0; overflow: hidden; }
.drop {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  margin: 18px; padding: 54px 24px 46px;
  border: 1px dashed var(--rule-strong); border-radius: 8px; background: var(--hover); cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s;
}
.drop:hover { border-color: var(--accent); background: var(--accent-soft); }
.drop .doc { width: 44px; height: 44px; color: var(--accent); stroke-width: 1.4; }
.drop h2 { margin: 6px 0 0; font: 600 20px/1.25 var(--sans); letter-spacing: -0.01em; }
.drop p { margin: 0; max-width: 460px; color: var(--ink-soft); }
.drop .btn { margin-top: 10px; }
.privacy { display: flex; gap: 10px; align-items: flex-start; margin: 0; padding: 14px 22px 18px; color: var(--ink-soft); font-size: 13.5px; }
.privacy svg { margin-top: 1px; color: var(--in); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.steps li { list-style: none; padding: 16px 18px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); }
.steps b { display: block; font-weight: 600; margin-bottom: 2px; }
.steps span { color: var(--ink-soft); font-size: 14px; }
.steps i { font: 600 12px/1 var(--sans); color: var(--muted); font-style: normal; display: block; margin-bottom: 8px; }
.steps { padding: 0; margin-bottom: 0; }

/* ---- importer ---- */
.importer { margin: 0 0 20px; }
.imp-list { list-style: none; margin: 0; padding: 0; }
.imp {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--rule);
}
.imp:first-child { border-top: 0; padding-top: 0; }
.imp .file { font-weight: 500; overflow-wrap: anywhere; }
.imp .note { font-size: 13px; color: var(--ink-soft); }
.imp.error .note { color: var(--danger); }
.imp.done .note { color: var(--in); }
.imp .bar { grid-column: 1 / -1; height: 2px; border-radius: 2px; background: var(--soft); overflow: hidden; margin-top: 6px; }
.imp .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
.imp .x { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--muted); }
.imp .x:hover { background: var(--soft); color: var(--ink); }
.unlock { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.unlock input { flex: 1 1 200px; height: 32px; padding: 0 10px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface); }
.imp-sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }
.imp-list[hidden] + .imp-sum { margin-top: 0; padding-top: 0; border-top: 0; }
.imp-sum p { margin: 0; color: var(--ink-soft); font-size: 14px; }

/* ---- overview: two columns, import + tag pies + highest on the left, a chart per year on the right ---- */
.dash { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; align-items: start; }
.dash-col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.legend { display: flex; gap: 14px; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 14px; }
.card-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.card-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.import-card .lead { margin: 0; padding: 0 16px 16px; color: var(--muted); font-size: 14px; }
.upload-drop {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px;
  border: 1px dashed var(--rule); border-radius: 8px; background: var(--hover);
}
.upload-drop .btn { height: 34px; padding: 0 14px; }
.upload-drop .hint { flex: 1; min-width: 180px; color: var(--muted); font-size: 13px; }

.pie-body { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.pie { width: 200px; height: 200px; flex: none; }
.pie-legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
.pie-legend li { font-size: 13px; }
.pie-legend a { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: inherit; text-decoration: none; }
.pie-legend a:hover .tg { text-decoration: underline; }
.pie-legend i { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.pie-legend .tg { font-weight: 500; text-transform: capitalize; }
.pie-legend .v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pie-note { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

.ylist-label { margin-bottom: 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ylist-row { display: flex; align-items: baseline; gap: 12px; padding: 3px 0; }
.ylist-row button { flex: none; min-width: 48px; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 700; text-align: left; }
.ylist-row button:hover { text-decoration: underline; }
.ylist-banks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.ylist-banks span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.ylist-banks i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

.highest > h2 { margin: 0 0 12px; font-size: 20px; font-weight: 600; }
.highest .card + .card { margin-top: 16px; }

.yblock { scroll-margin-top: 96px; }
.yhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.yhead h3 { margin: 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ystats { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.ystat { font-size: 12px; color: var(--muted); }
.ystat strong { font-weight: 700; font-variant-numeric: tabular-nums; }
.ystat.ok { color: var(--in); }
.ystat.bad { color: var(--danger); }
.ydelta { margin-left: 10px; }
.ydelta b { font-weight: 600; }
.ychart { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 8px; }
.yaxis { position: relative; height: 150px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.yaxis span { position: absolute; right: 0; transform: translateY(-50%); white-space: nowrap; }
.yplot { position: relative; min-width: 0; }
.ybox { position: relative; height: 150px; }
.ybox .gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--rule); }
.ybox svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; }
.ym { outline: none; }
.ym .hit { fill: transparent; }
.ym:focus-visible .hit { fill: var(--accent-soft); }
.ym .bar { opacity: 0.95; transition: opacity 0.12s; }
.ychart.hovering .ym:not(.on) .bar { opacity: 0.4; }
.ymonths { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); margin-top: 6px; font-size: 10px; color: var(--muted); text-align: center; }
.ytip {
  position: absolute; top: 4px; right: 8px; z-index: 2; pointer-events: none;
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px 10px; border-radius: 6px; background: rgb(17 24 39 / 0.92); color: #fff; font-size: 12px;
}
.ytip strong { font-weight: 600; }
.ytip span { display: inline-flex; align-items: center; gap: 6px; }
.ytip i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.ytip .tot { margin-top: 2px; color: #86efac; }

/* ---- horizontal bars (by tag) ---- */
.hbars { list-style: none; margin: 0; padding: 0; }
.hbars a, .hbars .hb-row {
  display: grid; grid-template-columns: minmax(84px, 9.5rem) minmax(0, 1fr) auto 3.2rem; align-items: center; gap: 12px;
  padding: 6px 6px; margin: 0 -6px; border-radius: 7px; text-decoration: none; font-size: 14px;
}
.hbars a:hover, .hbars a:focus-visible { background: var(--hover); }
.hb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { height: 10px; }
.hb-bar { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; }
.hb-bar.out { background: var(--out-mark); }
.hb-bar.in { background: var(--in-mark); }
.hb-bar.rest { background: var(--faint); }
.hb-val { font: 500 13px/1 var(--sans); font-variant-numeric: tabular-nums; text-align: right; }
.hb-pct { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.hbars .muted-row .hb-name { color: var(--muted); }

/* ---- people + transfer rows ---- */
.rows { list-style: none; margin: 0; padding: 0; }
.prow, .tx {
  display: grid; gap: 4px 16px; align-items: start;
  padding: 12px 8px; margin: 0 -8px; border-top: 1px solid var(--rule); border-radius: 8px;
}
.rows > li:first-child { border-top-color: transparent; }
.prow { grid-template-columns: 1.6rem minmax(0, 1fr) minmax(0, auto) auto; align-items: center; }
.prow .rank { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.prow.norank { grid-template-columns: minmax(0, 1fr) minmax(0, auto) auto; }
.prow.just-tagged, .tx.just-tagged { background: var(--hover); }
.name { font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
a.name:hover { text-decoration: underline; }
.name.none { color: var(--muted); font-weight: 400; }
.meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.sums { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.tags { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 5px; }
.chip {
  display: inline-flex; align-items: center; height: 24px; border-radius: 12px; background: var(--chip);
  font-size: 12.5px; white-space: nowrap;
}
.chip a { padding: 0 4px 0 10px; text-decoration: none; }
.chip a:hover { text-decoration: underline; }
.chip button { width: 22px; height: 22px; margin-right: 1px; border: 0; border-radius: 11px; background: none; color: var(--muted); font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--danger); background: var(--danger-soft); }
.chip.solo a { padding-right: 10px; }
.tag-add {
  height: 24px; padding: 0 10px; border-radius: 12px; border: 1px dashed var(--rule-strong);
  background: none; color: var(--ink-soft); font-size: 12.5px; white-space: nowrap;
}
.tag-add:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
.tag-add.plus { width: 24px; padding: 0; }

.tx { grid-template-columns: 5.2rem minmax(0, 1fr) minmax(0, auto) auto; }
.tx .when { font-size: 13px; line-height: 1.4; color: var(--muted); font-variant-numeric: tabular-nums; }
.tx .when a { display: block; color: var(--ink-soft); text-decoration: none; }
.tx .when a:hover { text-decoration: underline; }

<script id="parsers">
// Bank statement parsers: a line-for-line port of the server's importer
// (statements/server/Services/StatementImporter.php), which documents every
// quirk below in full. pdf.js text in, transfer rows out; nothing leaves the page.
const Parsers = (() => {
  'use strict';

  const MONTHS = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };

  // ---------- PHP string semantics ----------
  // The parsers were tuned against PHP, where strpos/substr/strlen and regex
  // offsets count BYTES while mb_* count characters. ₦ is three bytes, so a
  // byte-based column slice on a line carrying ₦ lands two characters left of a
  // character slice, and the Kuda/ALAT column maths depends on exactly that.
  // These helpers reproduce PHP so each parser reads like its original.

  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const isAscii = (s) => !/[^\x00-\x7f]/.test(s);
  const hasAstral = (s) => /[\ud800-\udfff]/.test(s);
  const bin = (s) => (isAscii(s) ? s : Array.from(enc.encode(s), (b) => String.fromCharCode(b)).join(''));
  const asciiLower = (s) => s.replace(/[A-Z]+/g, (m) => m.toLowerCase());

  const strlen = (s) => (isAscii(s) ? s.length : enc.encode(s).length);
  const byteOff = (s, i) => (isAscii(s) ? i : enc.encode(s.slice(0, i)).length);
  const mbStrlen = (s) => (hasAstral(s) ? Array.from(s).length : s.length);

  // PHP's start/length clamping, shared by substr() and mb_substr().
  function clampRange(len, start, length) {
    if (start > len) return null;
    if (start < 0) start = -start > len ? 0 : len + start;
    if (length == null) length = len - start;
    else if (length < 0) length = -length > len - start ? 0 : len - start + length;
    else if (length > len - start) length = len - start;
    return [start, length];
  }

  function substr(s, start, length = null) {
    if (isAscii(s)) {
      const r = clampRange(s.length, start, length);
      return r ? s.slice(r[0], r[0] + r[1]) : '';
    }
    const b = enc.encode(s);
    const r = clampRange(b.length, start, length);
    return r ? dec.decode(b.subarray(r[0], r[0] + r[1])) : '';
  }

  function mbSubstr(s, start, length = null) {
    const cps = hasAstral(s) ? Array.from(s) : null;
    const r = clampRange(cps ? cps.length : s.length, start, length);
    if (!r) return '';
    return cps ? cps.slice(r[0], r[0] + r[1]).join('') : s.slice(r[0], r[0] + r[1]);
  }

  // strpos/stripos: byte offset, or null where PHP returns false.
  function strpos(h, needle, from = 0) {
    const i = bin(h).indexOf(bin(needle), from);
    return i < 0 ? null : i;
  }
  function stripos(h, needle, from = 0) {
    const i = asciiLower(bin(h)).indexOf(asciiLower(bin(needle)), from);
    return i < 0 ? null : i;
  }
  function mbStrpos(h, needle) {
    const i = h.indexOf(needle);
    if (i < 0) return null;
    return hasAstral(h) ? Array.from(h.slice(0, i)).length : i;
  }
  // mb_stripos($h, $needle) === 0
  function mbStartsWithI(h, needle) {
    const fold = (s) => Array.from(s, (c) => (c.toLowerCase().length === c.length ? c.toLowerCase() : c)).join('');
    return fold(h).startsWith(fold(needle));
  }

  // preg_match_all(..., PREG_OFFSET_CAPTURE)[0]: each match with its byte offset.
  const matchAllAt = (re, s) => Array.from(s.matchAll(re), (m) => ({ text: m[0], at: byteOff(s, m.index), m }));

  // trim() family with PHP's default character list.
  const WS = ' \t\n\r\0\x0B';
  function ptrim(s, chars = WS) {
    let a = 0;
    let b = s.length;
    while (a < b && chars.includes(s[a])) a++;
    while (b > a && chars.includes(s[b - 1])) b--;
    return s.slice(a, b);
  }
  function prtrim(s, chars = WS) {
    let b = s.length;
    while (b > 0 && chars.includes(s[b - 1])) b--;
    return s.slice(0, b);
  }
  function pltrim(s, chars = WS) {
    let a = 0;
    while (a < s.length && chars.includes(s[a])) a++;
    return s.slice(a);
  }

  // preg_split($re, $s, 2): the text before the first match, then the rest.
  function splitOnce(re, s) {
    const m = re.exec(s);
    return m ? [s.slice(0, m.index), s.slice(m.index + m[0].length)] : [s];
  }

  const pad = (n, width = 2) => String(n).padStart(width, '0');
  const ucfirst = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // mb_convert_case(mb_strtolower($s), MB_CASE_TITLE): a cased letter starts a
  // word unless it follows another cased letter, with case-ignorable marks
  // ('.:’ etc.) in between. Digits, hyphens and underscores break words.
  const TITLE = { ß: 'Ss', ǆ: 'ǅ', ǉ: 'ǈ', ǌ: 'ǋ', ǳ: 'ǲ', ﬀ: 'Ff', ﬁ: 'Fi', ﬂ: 'Fl', ﬃ: 'Ffi', ﬄ: 'Ffl', ﬅ: 'St', ﬆ: 'St' };
  function titleCase(s) {
    let out = '';
    let start = true;
    for (const ch of s.toLowerCase()) {
      const cased = /\p{Cased}/u.test(ch);
      if (start) {
        out += cased ? TITLE[ch] || ch.toUpperCase() : ch;
        if (cased) start = false;
      } else {
        out += ch;
        if (!cased && !/\p{Case_Ignorable}/u.test(ch)) start = true;
      }
    }
    return out;
  }

  // ---------- Shared helpers ----------

  function toKobo(s) {
    s = ptrim(String(s ?? '').replaceAll(',', '').replaceAll('₦', '').replaceAll('NGN', ''));
    if (s === '' || s === '-' || s === '--') return null;
    if (s[0] === '.') s = '0' + s;
    let neg = false;
    if (s[0] === '-') {
      neg = true;
      s = s.slice(1);
    }
    if (!/^[0-9]+(\.[0-9]+)?$/.test(s)) return null;
    const val = Math.round(parseFloat(s) * 100);
    return neg ? -val : val;
  }

  function parseDayMonYearDate(s) {
    const m = /^(\d{2})-([A-Za-z]{3})-(\d{4})$/.exec(s);
    if (!m) return null;
    const mon = MONTHS[ucfirst(m[2].toLowerCase())];
    if (!mon) return null;
    return `${pad(+m[3], 4)}-${pad(mon)}-${pad(+m[1])} 00:00:00`;
  }

  const ymdhms = (y, mo, d, h = 0, mi = 0, s = 0) => `${pad(y, 4)}-${pad(mo)}-${pad(d)} ${pad(h)}:${pad(mi)}:${pad(s)}`;

  function sliceCol(line, start, end) {
    if (start == null || start >= strlen(line)) return '';
    if (end == null) return prtrim(substr(line, start));
    return prtrim(substr(line, start, end - start));
  }

  // Character-based slice for rows carrying ₦ (see the Kuda parser).
  function mbSliceCol(line, start, end) {
    if (start == null) return '';
    if (start >= mbStrlen(line)) return '';
    if (end == null) return prtrim(mbSubstr(line, start));
    return prtrim(mbSubstr(line, start, end - start));
  }

  // Where `text` last appears in [from, to) of `line`, in characters; -1 if not.
  function lastAt(line, text, from, to) {
    const cps = Array.from(line).slice(from, to ?? undefined);
    const tx = Array.from(text);
    for (let i = cps.length - tx.length; i >= 0; i--) if (tx.every((c, j) => cps[i + j] === c)) return from + i;
    return -1;
  }

  // Character boundaries for a left cell [start, end) and the cell to its right
  // (whose own data starts at `from`), when the left cell can run on past the
  // right one's heading: "…Obi/0123456789/Opay" crosses into Description.
  // A word crossing `end` that began before `from`, and holds a "/" like a
  // "Name/Account/Bank" cell does, stays with the left cell.
  function straddle(line, start, end, from) {
    if (end == null || from == null || end <= start) return [end, from];
    const ch = hasAstral(line) ? Array.from(line) : line;
    const word = (c) => c !== undefined && c !== ' ';
    if (!word(ch[end - 1]) || !word(ch[end])) return [end, from];
    let s = end - 1;
    while (s > start && word(ch[s - 1])) s--;
    let e = end;
    while (word(ch[e])) e++;
    const w = Array.isArray(ch) ? ch.slice(s, e).join('') : ch.slice(s, e);
    if (s >= from || !w.includes('/')) return [end, from];
    return [e, Math.max(from, e)];
  }

  // A number is never part of a name: pull a 10-digit NUBAN out of it, drop the
  // digits and payment-channel noise, and Title Case what's left.
  function cleanCounterpartyName(name, acct) {
    name = name == null ? '' : String(name);
    let m;
    if ((acct == null || acct === '') && (m = /(?<!\d)\d{10}(?!\d)/.exec(name))) acct = m[0];
    name = name.replace(/\d+/g, ' ');
    name = name.replace(/\s*\/\s*/g, ' ');
    name = name.replace(/\b(trf-)?chipper\s*cash\b/gi, ' ');
    name = name.replace(/\b(trf-)?chippercash\b/gi, ' ');
    name = name.replace(/\btrf-chipper\b/gi, ' ');
    name = ptrim(name.replace(/\s{2,}/g, ' '));
    name = ptrim(name, ' /,-');
    if (name !== '') name = titleCase(name);
    acct = typeof acct === 'string' && /^\d{10}$/.test(acct) ? acct : null;
    return [name !== '' ? name : null, acct];
  }

  // Counterparty bank names get clipped by column overflow ("Gtba", "Opay D
  // Services Limited"); map a recognisable prefix back to the real name.
  const BANKS = [
    [/^(gtb|gtba|guaranty)/i, 'GTBank Plc'],
    [/^opay|digital\s+services\s+limited/i, 'Opay Digital Services Limited'],
    [/^paycom/i, 'Paycom (OPay)'],
    [/^palmpay/i, 'Palmpay'],
    [/^(9\s*pay|9psb)/i, '9 Payment Service Bank (9PSB)'],
    [/^(titan|paystack)/i, 'Titan Paystack'],
    [/^moni/i, 'Moniepoint MFB'],
    [/^kuda/i, 'Kuda MFB'],
    [/^wema/i, 'Wema Bank'],
    [/^(flutterwave|flut)/i, 'Flutterwave'],
    [/^premium/i, 'Premium Trust Bank'],
    [/^access/i, 'Access Bank'],
    [/^zenith/i, 'Zenith Bank'],
    [/^uba\b|united\s+ban|for\s+africa/i, 'United Bank for Africa'],
    [/^first|^fbn\b|^fi\w*\s+of\s+nigeria/i, 'First Bank'],
    [/^fcmb/i, 'FCMB'],
    [/^fidelity/i, 'Fidelity Bank'],
    [/^union\s*bank/i, 'Union Bank'],
    [/^stanbic/i, 'Stanbic IBTC'],
    [/^sterling/i, 'Sterling Bank'],
    [/^polaris/i, 'Polaris Bank'],
    [/^keystone/i, 'Keystone Bank'],
    [/^ecobank/i, 'Ecobank'],
    [/^providus/i, 'Providus Bank'],
    [/^globus/i, 'Globus Bank'],
    [/^parallex/i, 'Parallex Bank'],
    [/^carbon/i, 'Carbon'],
    [/^artax/i, 'Artax Digital'],
    [/^chipper/i, 'Chipper Cash'],
    [/^jaiz/i, 'Jaiz Bank'],
    [/^lotus/i, 'Lotus Bank'],
    [/^taj/i, 'Taj Bank'],
    [/^sparkle/i, 'Sparkle'],
    [/^rubies/i, 'Rubies MFB'],
    [/^vfd/i, 'VFD MFB'],
    [/^cbn\b/i, 'CBN'],
  ];
  function canonicalBank(bank) {
    const b = ptrim(bank == null ? '' : String(bank));
    if (b === '') return null;
    for (const [re, name] of BANKS) if (re.test(b)) return name;
    // A wrapped column can split a word ("Paycom(Op ay)"): try it without spaces.
    const flat = b.replace(/\s+/g, '');
    for (const [re, name] of BANKS) if (re.test(flat)) return name;
    return b;
  }

  // OPay goes by several names on statements: "Opay Digital Services Limited"
  // (often clipped to "…Services L", "Opay Digit Services Ltd"), "Paycom(Opay)"
  // and "Paycom Nigeria Limited". Wherever a column wraps, clips or overruns,
  // that's the bank, never part of the person's name.
  const OPAY_IN_NAME = [
    // "Opay Digital Services Limited/Ltd/L", split anywhere by a wrap; a
    // reversal of a card payment at an OPay terminal reads the same.
    /(?:\breversal\s+of\s+)?\bo\s?p\s?a\s?y\s+digit\w*\s+serv\w*(?:\s+(?:limited|ltd|l)\b)?/gi,
    // "Paycom(Opay)", "Paycom(Op Ay)", "Paycom( Opay)", or clipped "Paycom(Opay"
    /\bpaycom\s*\([^)]*\)?/gi,
    /\bpaycom\s+nigeria(?:\s+(?:limited|ltd))?\b/gi,
    // a word run into "(Opay)"
    /\S*\(\s*o\s?p\s?a\s?y\s*\)/gi,
    // "/Opay" lost to the next column, leaving "Digital Services Limited"
    /\bdigital\s+services\s+limited\b/gi,
    // a bare "Opay" before or after a name: "Opay Ada Stores", "Ada Obi Opay"
    /^\s*o\s?pay\b/i,
    /\bopay\s*$/i,
  ];

  // Take OPay out of a counterparty name: [name left (or null), bank]. The bank
  // is OPay unless the row already had one.
  function splitBankFromName(name, bank) {
    if (!name) return [name, bank];
    let found = null;
    let rest = String(name);
    for (const re of OPAY_IN_NAME) {
      rest = rest.replace(re, (m) => {
        found ??= m;
        return ' ';
      });
    }
    if (found === null) return [name, bank];
    rest = ptrim(rest.replace(/\s{2,}/g, ' '), ' \t/,-|.:');
    if (rest.replace(/[^\p{L}]/gu, '').length < 2) rest = null;
    const hasBank = bank != null && ptrim(String(bank)) !== '';
    return [rest, hasBank ? bank : /paycom/i.test(found) ? 'Paycom (OPay)' : 'Opay Digital Services Limited'];
  }

  // ---------- Bank detection ----------

  // Order matters: OPay before Moniepoint, because OPay statements that pay a
  // Moniepoint account carry "TRF|2MPT…" references.
  const RULES = [
    ['Kuda', () => parseKuda, /Date\/Time\s+Money In\s+Money out/i],
    ['Barter', () => parseBarter, /BARTER ACCOUNT STATEMENT|Flutterwave Technology/i],
    ['Alat', () => parseAlat, /\bALAT\b|TIER 3 SAVINGS/i],
    ['OPay', () => parseOPay, /OWealth\b|OPay Card Payment|Trans\.\s*Time\s+Value Date\s+Description|Wallet Account/i],
    ['Moniepoint', () => parseMoniepoint, /CBA_DEBIT|CBA_CREDIT|Moniepoint Micr|Moniepoint MFB|\bMONIEPOINT\b|TRF\|2MPT/],
    ['Chipper', () => parseChipper, /chippercash\.com|Chipper Tag/i],
    ['GTBank', () => parseGTBank, /Trans\. Date\s+Value\. Date\s+Reference|Guaranty Trust Bank Plc Systems and Control/i],
  ];

  function detectBank(text) {
    const head = substr(text.slice(0, 8000), 0, 8000);
    for (const [bank, parser, re] of RULES) if (re.test(head)) return [bank, parser()];
    return [null, null];
  }

  // ---------- GTBank ----------

  function parseGTBank(text) {
    const lines = text.split('\n');
    let cols = null;
    let headerIdx = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (strpos(line, 'Trans. Date') != null && strpos(line, 'Value. Date') != null && strpos(line, 'Reference') != null && strpos(line, 'Debits') != null) {
        cols = {
          reference: strpos(line, 'Reference'),
          debits: strpos(line, 'Debits'),
          credits: strpos(line, 'Credits'),
          balance: strpos(line, 'Balance'),
          branch: strpos(line, 'Originating Branch'),
          remarks: strpos(line, 'Remarks'),
        };
        headerIdx = i;
        break;
      }
    }
    if (cols === null) return [];

    const rows = [];
    let current = null;
    const dateRe = /^\s*(\d{2}-[A-Za-z]{3}-\d{4})\s+(\d{2}-[A-Za-z]{3}-\d{4})/;
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const raw = lines[i];
      if (asciiLower(raw).includes('computer generated')) continue;
      if (raw.includes('Customer Information Unit')) continue;
      if (raw.includes('CUSTOMER STATEMENT')) continue;
      if (raw.includes('Statement Period')) continue;
      if (raw.includes('Trans. Date') && raw.includes('Value. Date')) continue;
      if (ptrim(raw) === '') continue;

      const m = dateRe.exec(raw);
      if (m) {
        if (current) rows.push(current);
        current = {
          trans_date: m[1],
          reference: pltrim(pltrim(sliceCol(raw, cols.reference, cols.debits)), "'"),
          debits: ptrim(sliceCol(raw, cols.debits, cols.credits)),
          credits: ptrim(sliceCol(raw, cols.credits, cols.balance)),
          balance: ptrim(sliceCol(raw, cols.balance, cols.branch)),
          branch: ptrim(sliceCol(raw, cols.branch, cols.remarks)),
          remarks: ptrim(sliceCol(raw, cols.remarks, null)),
        };
      } else {
        if (current === null) continue;
        const b = ptrim(sliceCol(raw, cols.branch, cols.remarks));
        const r = ptrim(sliceCol(raw, cols.remarks, null));
        if (b !== '') current.branch = ptrim(current.branch + ' ' + b);
        if (r !== '') current.remarks = ptrim(current.remarks + ' ' + r);
      }
    }
    if (current) rows.push(current);

    const txns = [];
    let prevBal = null;
    for (const r of rows) {
      const bal = toKobo(r.balance);
      if (bal === null) continue;
      const deb = toKobo(r.debits);
      const cre = toKobo(r.credits);
      let t;
      let amount;
      if (cre && !deb) {
        t = 'credit';
        amount = cre;
      } else if (deb && !cre) {
        t = 'debit';
        amount = deb;
      } else {
        if (prevBal === null) continue;
        const delta = bal - prevBal;
        t = delta > 0 ? 'credit' : 'debit';
        amount = Math.abs(delta);
      }
      const before = t === 'credit' ? bal - amount : bal + amount;
      const dt = parseDayMonYearDate(r.trans_date);
      if (dt === null) continue;
      let remarks = r.remarks;
      if (r.reference !== '') remarks = ptrim(remarks + ' | Ref: ' + r.reference, ' |');
      if (r.branch !== '') remarks = ptrim(remarks + ' | Branch: ' + r.branch, ' |');
      txns.push({ transfer_type: t, balance_after: bal, balance_before: before, remarks, created_at: dt });
      prevBal = bal;
    }
    return txns;
  }

  // ---------- Kuda ----------

  // Page furniture repeated on every page. When a transaction straddles a page
  // break these lines land inside its group, so they're dropped outright.
  const KUDA_CHROME = /Kuda MF Bank|Deposit Insurance Corporation|Central Bank of Nigeria|Kuda Technologies|Finsbury Pavement|EC2A\s*1NT|Account Number\s*:|Page\s+\d+\s+of\s+\d+/i;

  function parseKuda(text) {
    const lines = text.split('\n');

    // The newer layout (2026+) has no "Category" header and wraps each
    // transaction over three lines.
    for (const line of lines) {
      if (stripos(line, 'Date/Time') != null && stripos(line, 'Money In') != null && stripos(line, 'Money Out') != null && stripos(line, 'Balance') != null && stripos(line, 'Category') == null) {
        return parseKudaWrapped(lines, line);
      }
    }

    // Header capitalisation and spacing vary between exports.
    const colAt = (line, re) => {
      const m = re.exec(line);
      return m ? byteOff(line, m.index) : null;
    };
    const colsFor = (line) => {
      if (stripos(line, 'Date/Time') == null || stripos(line, 'Money In') == null || stripos(line, 'Money Out') == null || stripos(line, 'Balance') == null) return null;
      return {
        money_in: colAt(line, /Money\s+In/i),
        money_out: colAt(line, /Money\s+Out/i),
        category: colAt(line, /Category/i),
        to_from: colAt(line, /To\s*\/\s*From/i),
        description: colAt(line, /Description/i),
        balance: colAt(line, /Balance/i),
      };
    };

    let cols = null;
    let headerIdx = null;
    for (let i = 0; i < lines.length; i++) {
      const c = colsFor(lines[i]);
      if (c) {
        cols = c;
        headerIdx = i;
        break;
      }
    }
    if (cols === null) return [];

    const dateRe = /^\s*(\d{2}\/\d{2}\/\d{2})\b/;
    const timeRe = /^\s*(\d{2}:\d{2}:\d{2})\b/;
    // "-₦2,770.00": the minus sits flush before the naira sign.
    const nairaRe = /(-?)₦\s*(-?[\d,]+\.\d{2})/gu;

    const groups = [];
    let buffer = [];
    let current = null;
    let sawTime = false;
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const raw = lines[i];
      const stripped = ptrim(raw);
      if (strlen(stripped) < 30 && raw.includes('Statement')) continue;
      if (strlen(stripped) < 30 && raw.includes('Summary')) continue;
      if (KUDA_CHROME.test(raw)) continue;

      // Every page repeats the header and the columns drift between pages, so
      // each group remembers the columns in force for its page.
      const c = colsFor(raw);
      if (c) {
        cols = c;
        continue;
      }

      if (dateRe.test(raw)) {
        if (current !== null) groups.push(current);
        current = { lines: [...buffer, raw], cols };
        buffer = [];
        sawTime = false;
        continue;
      }
      if (current !== null) {
        if (stripped === '') {
          if (sawTime) {
            groups.push(current);
            current = null;
            sawTime = false;
          }
        } else {
          current.lines.push(raw);
          if (timeRe.test(raw)) sawTime = true;
        }
      } else if (stripped !== '') {
        buffer.push(raw);
      }
    }
    if (current !== null) groups.push(current);

    const txns = [];
    for (const g of groups) {
      cols = g.cols ?? cols;
      const dateLine = g.lines.find((l) => dateRe.test(l));
      if (dateLine === undefined) continue;
      const dateS = dateRe.exec(dateLine)[1];

      let timeS = null;
      for (const l of g.lines) {
        const tm = timeRe.exec(l);
        if (tm) {
          timeS = tm[1];
          break;
        }
      }

      const amountLine = g.lines.find((l) => l.includes('₦'));
      if (amountLine === undefined) continue;
      const nairas = Array.from(amountLine.matchAll(nairaRe), (m) => (m[1] === '-' ? '-' : '') + m[2]);
      if (nairas.length < 2) continue;
      let amount = toKobo(nairas[0]);
      const balance = toKobo(nairas[nairas.length - 1]);
      if (amount === null || balance === null) continue;
      amount = Math.abs(amount);

      // Amounts sit a character or two left of their heading, so split on the
      // midpoint between the two money columns.
      const amtPos = mbStrpos(amountLine, '₦');
      const moneyMid = (cols.money_in + cols.money_out) / 2;
      const t = amtPos >= moneyMid ? 'debit' : 'credit';
      const before = t === 'credit' ? balance - amount : balance + amount;

      // To/From and Description data sit ~2 characters left of their headings.
      const tfStart = cols.to_from - 2;
      const dsStart = cols.description !== null ? cols.description - 2 : cols.description;
      const toFrom = [];
      const description = [];
      const category = [];
      for (const l of g.lines) {
        const cat = ptrim(mbSliceCol(l, cols.category, tfStart));
        const [tfEnd, dsFrom] = straddle(l, tfStart, cols.description, dsStart);
        let tf = ptrim(mbSliceCol(l, tfStart, tfEnd));
        let ds = ptrim(mbSliceCol(l, dsFrom, cols.balance));
        // A negative balance's "-₦" bleeds into the description slice.
        ds = ptrim(ds.replace(/\s*-?\s*₦[\d,.]*\s*$/gu, ''));
        // The description's first letters can land at the tail of To/From
        // ("transfer" -> "Tr"); drop them when they really start this line's
        // description.
        const bm = tf !== '' && ds !== '' ? /\s(\S{1,3})$/u.exec(tf) : null;
        if (bm) {
          const frag = bm[1];
          if (mbStrlen(frag) < mbStrlen(ds) && mbStartsWithI(ds, frag)) {
            tf = prtrim(mbSubstr(tf, 0, mbStrlen(tf) - mbStrlen(frag)));
          }
        } else if (tf !== '' && ds !== '' && mbStrlen(tf) <= 3 && mbStrlen(tf) < mbStrlen(ds) && mbStartsWithI(ds, tf) && lastAt(l, tf, tfStart, tfEnd) >= dsStart) {
          // To/From is empty and the description starts a little early, so its
          // first letter or two are all To/From got ("o" of "opay …").
          tf = '';
        }
        if (cat !== '' && !/\d/.test(cat)) category.push(cat);
        if (tf !== '') toFrom.push(tf);
        if (ds !== '') description.push(ds);
      }
      const toFromFull = ptrim(toFrom.join(' '));

      let cpName = null;
      let cpAcct = null;
      let cpBank = null;
      if (toFromFull !== '') {
        // The column wraps mid-word, so an account number can come back as
        // "012345 6789".
        const cpm = /^(.+?)\s*\/\s*(\d(?: ?\d)*)?\s*\/\s*(.+?)\s*$/.exec(toFromFull);
        if (cpm) {
          cpName = ptrim(cpm[1]) !== '' ? ptrim(cpm[1]) : null;
          cpAcct = cpm[2] ? cpm[2].replace(/ /g, '') : null;
          cpBank = ptrim(cpm[3]) !== '' ? ptrim(cpm[3]) : null;
        } else {
          cpName = toFromFull;
        }
      }

      const remarks = [ptrim(category.join(' ')), ptrim(description.join(' '))].filter((x) => x !== '').join(' | ');

      // An empty To/From can carry the counterparty in the narration as
      // "Name:AccountNumber" (always multi-word, unlike Kuda's "kip:090405").
      if (cpName === null || cpName === '') {
        const rm = /([A-Za-z][A-Za-z.'’\-]+(?: [A-Za-z.'’\-]+)+)\s*:\s*(\d{6,})/u.exec(remarks);
        if (rm) {
          cpName = ptrim(rm[1]);
          if (cpAcct === null || cpAcct === '') cpAcct = rm[2];
        }
      }
      // Still nothing: a POS / bill / web payment, so the merchant is the description.
      if (cpName === null || cpName === '') {
        let descName = ptrim(description.join(' '));
        descName = descName.replace(/\bkip:\S*/gi, '');
        descName = ptrim(descName.replace(/\s{2,}/g, ' '));
        if (descName !== '') cpName = descName;
      }

      const [d, mo, y] = dateS.split('/');
      const year = +y < 50 ? 2000 + +y : 1900 + +y;
      const [th, tmin, ts] = timeS ? timeS.split(':') : [0, 0, 0];

      txns.push({
        transfer_type: t,
        // Kuda's ₦50 CBN levy rows read "Cbn/<acct>/<bank>" in To / From.
        transfer_category: /^\s*cbn\s*\//i.test(toFromFull) ? 'charge' : 'transfer',
        balance_after: balance,
        balance_before: before,
        remarks,
        created_at: ymdhms(year, +mo, +d, +th, +tmin, +ts),
        account_name: cpName,
        account_number: cpAcct,
        bank_name: cpBank,
      });
    }
    return txns;
  }

  // Newer Kuda layout: date, the ₦ amount/description/balance row, and time on
  // separate lines, with category and "Name/Account/Bank" wrapping across them.
  function parseKudaWrapped(lines, header) {
    // The category column is the SECOND "Money Out" heading.
    const pOut = stripos(header, 'Money Out');
    const pCat = stripos(header, 'Money Out', pOut + 1);
    const pTo = stripos(header, 'To / From');
    const pDesc = stripos(header, 'Description');
    const tfStart = Math.max(0, pTo - 2);

    const dateRe = /^\s*(\d{2}\/\d{2}\/\d{2})\b/;
    const timeRe = /^\s*(\d{2}:\d{2}:\d{2})\b/;
    const nairaRe = /₦\s*(-?[\d,]+\.\d{2})/gu;

    const groups = [];
    let current = null;
    for (const raw of lines) {
      if (KUDA_CHROME.test(raw)) continue;
      if (stripos(raw, 'Date/Time') != null && stripos(raw, 'Balance') != null) continue;
      if (dateRe.test(raw)) {
        if (current) groups.push(current);
        current = [raw];
      } else if (current !== null && ptrim(raw) !== '') {
        current.push(raw);
      }
    }
    if (current) groups.push(current);

    const txns = [];
    for (const g of groups) {
      let dateS = null;
      let timeS = null;
      for (const l of g) {
        const m = dateS === null && dateRe.exec(l);
        if (m) dateS = m[1];
      }
      for (const l of g) {
        const m = timeS === null && timeRe.exec(l);
        if (m) timeS = m[1];
      }
      if (dateS === null) continue;

      // First ₦ = amount, last = balance.
      const amountLine = g.find((l) => l.includes('₦'));
      if (amountLine === undefined) continue;
      const nm = matchAllAt(nairaRe, amountLine);
      if (nm.length < 2) continue;
      const amount = toKobo(nm[0].m[1]);
      const last = nm[nm.length - 1];
      const balance = toKobo(last.m[1]);
      if (amount === null || balance === null) continue;
      const amtPos = nm[0].at;
      const balPos = last.at;

      const type = amtPos < pOut - 2 ? 'credit' : 'debit';
      const before = type === 'credit' ? balance - amount : balance + amount;

      const catParts = [];
      for (const l of g) {
        const c = ptrim(sliceCol(l, pCat, tfStart));
        if (c !== '') catParts.push(c);
      }
      const category = ptrim(catParts.join(' ').replace(/\s{2,}/g, ' '));

      // To/From across every line of the group, kept to its own column so a
      // neighbouring row's wrapped description can't bleed in.
      const tfParts = [];
      for (const l of g) {
        const s = ptrim(sliceCol(l, tfStart, pDesc));
        if (s !== '') tfParts.push(s);
      }
      const tfBlob = ptrim(tfParts.join(' ').replace(/\s{2,}/g, ' '));

      // "transfer" is Kuda's generic filler.
      const descBlob = ptrim(ptrim(sliceCol(amountLine, pDesc, balPos)).replace(/\s{2,}/g, ' '));
      const desc = ptrim(descBlob.replace(/\btransfer\b/gi, ' ').replace(/\s{2,}/g, ' '));

      const isCharge = /\bcbn\b|stamp duty|vat charge|\blevy\b/i.test(category + ' ' + tfBlob + ' ' + descBlob);

      let cpName = null;
      let cpAcct = null;
      let cpBank = null;
      const cpm = /^(.*?)\/\s*(\d(?: ?\d){5,})\s*\/\s*(.*)$/.exec(tfBlob);
      if (cpm) {
        cpName = ptrim(cpm[1]) !== '' ? ptrim(cpm[1]) : null;
        cpAcct = cpm[2].replace(/ /g, '');
        const bankGuess = ptrim(cpm[3]) !== '' ? ptrim(cpm[3]) : descBlob;
        cpBank = bankGuess !== '' ? bankGuess : null;
      }
      // The category column can bleed a short tail into the name ("ds Adekunle").
      if (cpName !== null) {
        cpName = cpName.replace(/^[a-z]{1,4}\s+(?=[A-Z])/u, '');
        if (ptrim(cpName) === '') cpName = null;
      }
      if (cpName === null && !isCharge && desc !== '') cpName = desc;

      const [d, mo, y] = dateS.split('/');
      const year = +y < 50 ? 2000 + +y : 1900 + +y;
      const [th, tmin, ts] = timeS ? timeS.split(':') : [0, 0, 0];

      txns.push({
        transfer_type: type,
        transfer_category: isCharge ? 'charge' : 'transfer',
        balance_after: balance,
        balance_before: before,
        remarks: ptrim([category, desc].filter((x) => x !== '').join(' | ')),
        created_at: ymdhms(year, +mo, +d, +th, +tmin, +ts),
        account_name: cpName,
        account_number: cpAcct,
        bank_name: cpBank,
      });
    }
    return txns;
  }

  // ---------- Barter (Flutterwave) ----------

  // Grouped under "Month of MONTH, YEAR"; each transaction starts with a day
  // row ("31st  11:45:12 PM  …  -2,000.00  55,171.41") whose signed amount is
  // second from the right and balance right-most.
  function parseBarter(text) {
    const lines = text.split('\n');
    const monthRe = /Month of (\w+),?\s+(\d{4})/i;
    const dayRe = /^\s*(\d{1,2})(?:st|nd|rd|th)\s+(\d{1,2}):(\d{2}):(\d{2})\s+([AP]M)\b/;
    const amountRe = /-?[\d,]+\.\d{2}/g;

    let currentMonth = null;
    let currentYear = null;
    const groups = [];
    let current = null;
    for (const raw of lines) {
      const mm = monthRe.exec(raw);
      if (mm) {
        currentMonth = MONTHS[ucfirst(mm[1].slice(0, 3).toLowerCase())] ?? null;
        currentYear = +mm[2];
        continue;
      }
      if (stripos(raw, 'Narration') != null && stripos(raw, 'Available Balance') != null) continue;

      const dm = dayRe.exec(raw);
      if (dm) {
        if (current) groups.push(current);
        let hour = +dm[2];
        if (dm[5] === 'PM' && hour !== 12) hour += 12;
        if (dm[5] === 'AM' && hour === 12) hour = 0;
        current = {
          day: +dm[1],
          hour,
          min: +dm[3],
          sec: +dm[4],
          month: currentMonth,
          year: currentYear,
          firstLine: raw,
          firstTextStart: byteOff(raw, dm.index) + strlen(dm[0]),
          extra: [],
        };
      } else if (current && ptrim(raw) !== '') {
        current.extra.push(ptrim(raw));
      }
    }
    if (current) groups.push(current);

    const txns = [];
    for (const g of groups) {
      if (!g.month || !g.year) continue;
      const am = matchAllAt(amountRe, g.firstLine);
      if (am.length < 2) continue;
      const balance = toKobo(am[am.length - 1].text);
      const signed = toKobo(am[am.length - 2].text);
      if (balance === null || signed === null || signed === 0) continue;

      const type = signed < 0 ? 'debit' : 'credit';
      const amount = Math.abs(signed);
      const before = type === 'credit' ? balance - amount : balance + amount;

      let narr = substr(g.firstLine, g.firstTextStart, am[0].at - g.firstTextStart);
      narr = ptrim(narr.replace(/\s{2,}/g, ' '));
      if (g.extra.length) {
        narr = ptrim(narr + ' ' + g.extra.join(' '));
        narr = ptrim(narr.replace(/\s{2,}/g, ' '));
      }
      // A row straddling a page break absorbs the "Copyright: …" footer.
      narr = ptrim(narr.replace(/\s*Copyright:.*/gis, ''));

      const [cpName, cpAcct, cpBank] = barterCounterparty(narr);
      txns.push({
        transfer_type: type,
        balance_after: balance,
        balance_before: before,
        remarks: narr,
        created_at: ymdhms(g.year, g.month, g.day, g.hour, g.min, g.sec),
        account_name: cpName,
        account_number: cpAcct,
        bank_name: cpBank,
      });
    }
    return txns;
  }

  function barterCounterparty(narr) {
    const r = ptrim(narr);
    let m = /(?<!\d)(\d{10})(?!\d)\s*\//.exec(r);
    const acct = m ? m[1] : null;

    if (/BillsPayment\b/i.test(r)) {
      m = /\b(Airtel|MTN|9mobile|Glo|Etisalat)\b/i.exec(r);
      return [m ? m[1] : null, null, null];
    }

    if ((m = /Received Money from\s+(.+)$/is.exec(r))) {
      const rest = m[1];
      let bank = null;
      let name = null;
      const bar = rest.indexOf('|');
      if (bar >= 0) {
        bank = ptrim(rest.slice(0, bar));
        name = barterTrimName(rest.slice(bar + 1));
      } else {
        bank = barterTrimName(rest);
      }
      // Barter's placeholders for an unknown sender bank.
      if (bank !== null && /^(GENERATED|NotOnBankList)$/i.test(bank)) bank = null;
      return [name, acct, bank !== '' ? bank : null];
    }

    if ((m = /Transfer to\s+(.+)$/is.exec(r))) return [barterTrimName(m[1]), acct, null];

    return [null, acct, null];
  }

  function barterTrimName(s) {
    s = s.replace(/\s*-?\s*NIP:.*/gis, '');
    s = splitOnce(/\s*(?:\d{6,}|\/)/, s)[0];
    s = ptrim(s, ' -|,');
    return s !== '' ? s : null;
  }

  // ---------- ALAT ----------

  // Two layouts that differ only in how the date wraps: "11-Jan-2021" on the
  // data row, or "05-Jan-" above it and "2021" below. Anchor on the data row
  // (reference ID + amounts) and rebuild the date around it.
  function parseAlat(text) {
    const lines = text.split('\n');
    const n = lines.length;
    const headerRe = /Date\b.*?Transaction Details\b.*?Credit.*?Debit.*?Balance/i;
    const singleLineDateRe = /^\s*(\d{2}-[A-Za-z]{3}-\d{4})\b/;
    const shortDateRe = /^\s*(\d{2})-([A-Za-z]{3})-(?:\s|$)/;
    const yearRe = /^\s*(\d{4})(?:\s|$)/;
    const refRe = /\b[A-Z]\d{3,}\b/;
    const amountRe = /[\d,]+\.\d{2}/g;

    const txns = [];
    let cols = null;
    let prevBal = null;
    for (let i = 0; i < n; i++) {
      const line = lines[i];

      // Every page repeats the header and the columns drift, so refresh them.
      if (headerRe.test(line)) {
        cols = {
          credit: strpos(line, 'Credit'),
          debit: strpos(line, 'Debit'),
          balance: strpos(line, 'Balance'),
        };
        continue;
      }
      if (cols === null) continue;
      if (stripos(line, 'computer generated') != null) continue;

      const rm = refRe.exec(line);
      if (!rm) continue;
      const am = matchAllAt(amountRe, line);
      if (!am.length) continue;

      let dateStr = null;
      const dm = singleLineDateRe.exec(line);
      if (dm) {
        dateStr = dm[1];
      } else {
        let dd = null;
        let mon = null;
        let yyyy = null;
        for (let j = i - 1; j >= Math.max(0, i - 6); j--) {
          if (ptrim(lines[j]) === '') continue;
          const sm = shortDateRe.exec(lines[j]);
          if (sm) {
            dd = sm[1];
            mon = sm[2];
          }
          break;
        }
        for (let j = i + 1; j <= Math.min(n - 1, i + 6); j++) {
          if (ptrim(lines[j]) === '') continue;
          const ym = yearRe.exec(lines[j]);
          if (ym) yyyy = ym[1];
          break;
        }
        if (dd && mon && yyyy) dateStr = `${dd}-${mon}-${yyyy}`;
      }
      if (dateStr === null) continue;

      const creditMid = (cols.credit + cols.debit) / 2;
      const debitMid = (cols.debit + cols.balance) / 2;
      const bal = toKobo(am[am.length - 1].text);
      if (bal === null) continue;

      let creditStr = '';
      let debitStr = '';
      for (const tok of am.slice(0, -1)) {
        if (tok.at < creditMid) creditStr = tok.text;
        else if (tok.at < debitMid) debitStr = tok.text;
      }
      const cre = toKobo(creditStr);
      const deb = toKobo(debitStr);

      let type;
      let amount;
      if (deb && deb != 0) {
        type = 'debit';
        amount = Math.abs(deb);
      } else if (cre && cre != 0) {
        type = 'credit';
        amount = Math.abs(cre);
      } else {
        if (prevBal === null) {
          prevBal = bal;
          continue;
        }
        const delta = bal - prevBal;
        if (delta > 0) {
          type = 'credit';
          amount = delta;
        } else if (delta < 0) {
          type = 'debit';
          amount = -delta;
        } else {
          prevBal = bal;
          continue;
        }
      }
      const before = type === 'credit' ? bal - amount : bal + amount;

      const dt = parseDayMonYearDate(dateStr);
      if (dt === null) continue;

      // Details: the text between the reference and the first amount.
      const refEnd = byteOff(line, rm.index) + strlen(rm[0]);
      let details = ptrim(substr(line, refEnd, am[0].at - refEnd));
      details = ptrim(details.replace(/\s+/g, ' '));

      const [cpName, cpAcct, cpBank, cpCat] = alatCounterparty(details);
      txns.push({
        transfer_type: type,
        transfer_category: cpCat,
        balance_after: bal,
        balance_before: before,
        remarks: [details, 'Ref: ' + rm[0]].filter((x) => x !== '').join(' | '),
        created_at: dt,
        account_name: cpName,
        account_number: cpAcct,
        bank_name: cpBank,
      });
      prevBal = bal;
    }
    return txns;
  }

  // ALAT never gives the counterparty its own column; it's embedded in the
  // narration in a handful of shapes. Fees and levies are charges.
  function alatCounterparty(details) {
    const d = ptrim(details);

    if (
      /^(vat|comm)\b/i.test(d) ||
      /electronic money transfer levy/i.test(d) ||
      /stamp duty/i.test(d) ||
      /maintenance fee/i.test(d) ||
      /account maintenance/i.test(d) ||
      /sms alert/i.test(d) ||
      /\bw\.?tax\b|wtax/i.test(d)
    ) {
      return [null, null, null, 'charge'];
    }

    let m;
    // Inbound NIP credit: "NIP:<sender name>-<narration>".
    if ((m = /^NIP:\s*(.+)$/is.exec(d))) {
      const name = ptrim(splitOnce(/\s*-\s*/, m[1])[0]);
      return [name !== '' ? name : null, null, null, 'transfer'];
    }

    // Outbound NIP: "ALAT NIP TRANSFER [REVERSAL] TO <X>…".
    if ((m = /ALAT\s+NIP\s+TRANSFER\s+(?:REVERSAL\s+)?TO\s+(.+)$/is.exec(d))) {
      const rest = ptrim(m[1]);
      const fm = /^(.+?)\s+FROM\b/i.exec(rest);
      if (fm) {
        const name = ptrim(fm[1]);
        return [name !== '' ? name : null, null, null, 'transfer'];
      }
      // Otherwise only the destination bank survives ALAT's narrow column.
      const bank = ptrim(splitOnce(/\s*-\s*/, rest)[0]);
      return [null, null, bank !== '' ? bank : null, 'transfer'];
    }

    // Internal ALAT → ALAT: "ALAT TRANSFER TO <name>-<acct>".
    if ((m = /ALAT\s+TRANSFER\s+TO\s+(.+)$/is.exec(d))) {
      const parts = splitOnce(/\s*-\s*/, ptrim(m[1]));
      const name = ptrim(parts[0]);
      const am = parts.length > 1 ? /(\d{6,})/.exec(parts[1]) : null;
      return [name !== '' ? name : null, am ? am[1] : null, null, 'transfer'];
    }

    if ((m = /^(?:rev-)?(?:airtime|data)\s*alat\s*([A-Za-z]+)/i.exec(d))) {
      const names = { MTN: 'MTN', AIRTEL: 'Airtel', ATL: 'Airtel', GLO: 'Glo', ETISALAT: '9mobile' };
      return [names[m[1].toUpperCase()] ?? null, null, null, 'transfer'];
    }
    if (/ALAT\s+AIRTIME\s+RECHARGE/i.test(d)) return ['Airtime', null, null, 'transfer'];

    // POS / web purchases: the merchant is clipped, leave it to the remarks.
    return [null, null, null, 'transfer'];
  }

  // ---------- Moniepoint ----------

  // The timestamp is split across four lines of the Date column ("2025-",
  // "06-", "01T17:", "27:32") with the data row somewhere among them, so lines
  // are segmented into blocks at each year marker.
  function parseMoniepoint(text) {
    const lines = text.split('\n');
    const n = lines.length;
    const refRe = /\S*_(DEBIT|CREDIT)_\d+(?:_EMTL_DC_\d+)?/;
    const amountRe = /[\d,]+\.\d{2}/g;
    const yearRe = /^\s*(\d{4})-(?!\d)/;
    const monthRe = /^\s*(\d{2})-(?!\d)/;
    const dayHrRe = /^\s*(\d{2})T(\d{2}):/;
    const msRe = /^\s*(\d{2}):(\d{2})(?:\s|$)/;
    const msAltRe = /^\s*(\d{2})(?:\s|$)/;

    const starts = [];
    for (let i = 0; i < n; i++) if (yearRe.test(lines[i])) starts.push(i);
    starts.push(n);

    const txns = [];
    for (let b = 0; b < starts.length - 1; b++) {
      const bStart = starts[b];
      const bEnd = starts[b + 1];
      let month = null;
      let dayHr = null;
      let minSec = null;
      let dataIdx = -1;
      let m = yearRe.exec(lines[bStart]);
      const year = m ? m[1] : null;

      // The data row can itself carry a date piece, so it isn't skipped.
      for (let i = bStart + 1; i < bEnd; i++) {
        const s = lines[i];
        if (s === '') continue;
        if (dataIdx === -1 && refRe.test(s)) dataIdx = i;
        if (dayHr === null && (m = dayHrRe.exec(s))) {
          dayHr = [m[1], m[2]];
          continue;
        }
        if (month === null && (m = monthRe.exec(s))) {
          month = m[1];
          continue;
        }
        if (minSec === null && (m = msRe.exec(s))) {
          minSec = [m[1], m[2]];
          continue;
        }
        if (minSec === null && (m = msAltRe.exec(s))) {
          minSec = [m[1], '00'];
          continue;
        }
      }
      if (dataIdx === -1 || !year || !month || !dayHr || !minSec) continue;

      const line = lines[dataIdx];
      const rm = refRe.exec(line);
      const am = Array.from(line.matchAll(amountRe));
      const amts = am.map((x) => x[0]);

      // 4 amounts: debit, credit, before, after. 6 (TRANSFER rows): amount,
      // debit, credit, before, after, charge.
      let dStr, cStr, beforeStr, afterStr;
      if (amts.length === 4) [dStr, cStr, beforeStr, afterStr] = amts;
      else if (amts.length === 6) [, dStr, cStr, beforeStr, afterStr] = amts;
      else continue;

      const debitV = toKobo(dStr) ?? 0;
      const creditV = toKobo(cStr) ?? 0;
      const before = toKobo(beforeStr);
      const after = toKobo(afterStr);
      if (before === null || after === null) continue;

      let type;
      if (debitV > 0) type = 'debit';
      else if (creditV > 0) type = 'credit';
      else continue;

      // Right of the last amount: Beneficiary / Source columns and Narration.
      const lastAm = am[am.length - 1];
      const tail = ptrim(line.slice(lastAm.index + lastAm[0].length));
      const segs = tail.split(/\s{2,}/).map((x) => ptrim(x)).filter((x) => x !== '');

      // Only a credit's 10-digit segment is the counterparty; on a debit it's
      // our own account.
      let cpAcct = null;
      if (type === 'credit') cpAcct = segs.find((s) => /^\d{10}$/.test(s)) ?? null;

      let narr = '';
      for (const s of segs) if (/transfer|purchase at|card |payment|airtime|bill/i.test(s)) narr = s;
      if (narr === '' && segs.length) narr = segs[segs.length - 1];

      // A credit's counterparty is the sender ("FROM <name>"); a debit's is the
      // recipient ("TO <name>" / "purchase at <merchant>").
      let cpName = null;
      let cpBank = null;
      let mm;
      if (type === 'credit') {
        if ((mm = /\bFROM\s+(.+?)(?:\s+to\s+|\s*$)/i.exec(narr))) cpName = mm[1];
      } else if ((mm = /\bTO\s+(.+?)\s*$/i.exec(narr))) {
        cpName = mm[1];
      } else if ((mm = /\bat\s+(.+?)\s*$/i.exec(narr))) {
        cpName = mm[1];
      }
      if (cpName !== null) {
        cpName = cpName.replace(/\s*\*{2,}.*$/g, '');
        cpName = cpName.replace(/\s*\/.*$/g, '');
        // Split a trailing Title-Case bank ("Kuda Bank") off the CAPS name.
        const nm = /^(.*?[A-Z0-9])\s+([A-Z][a-z].*)$/.exec(ptrim(cpName));
        if (nm && /bank|mfb|microfinance|opay|kuda|palmpay|moniepoint/i.test(nm[2])) {
          cpName = nm[1];
          cpBank = nm[2];
        }
        cpName = cpName.replace(/^T\s+/, '');
        cpName = cpName.replace(/\s+\d{1,4}\s*$/g, '');
        cpName = ptrim(cpName);
        if (/^(trf|ref|pos|atm|nip|ussd|na)$/i.test(cpName) || /-\d{3,}/.test(cpName) || cpName.replace(/[^A-Za-z]/g, '').length < 2) {
          cpName = null;
        }
      }
      if (cpBank === null) {
        for (const s of segs) {
          if (s === narr || /^\d{10}$/.test(s)) continue;
          if (/bank|mfb|microfinance|opay|kuda|palmpay|payment/i.test(s) && stripos(s, 'moniepoint') == null) {
            cpBank = s;
            break;
          }
        }
      }

      txns.push({
        transfer_type: type,
        balance_after: after,
        balance_before: before,
        remarks: (narr !== '' ? narr + ' | ' : '') + 'Ref: ' + ptrim(rm[0]),
        created_at: `${year}-${month}-${dayHr[0]} ${dayHr[1]}:${minSec[0]}:${minSec[1]}`,
        account_name: cpName !== null && cpName !== '' ? cpName : null,
        account_number: cpAcct,
        bank_name: cpBank,
      });
    }
    return txns;
  }

  // ---------- Chipper ----------

  function parseChipper(text) {
    const lines = text.split('\n');
    const mainRe = /^\s*(\d{4}-\d{2}-\d{2})\s+(\d+)\s+(.+?)\s+(-?[\d,]+\.\d{2})\s+(-?[\d,]+\.\d{2})\s+(-?[\d,]+\.\d{2})\s*$/;
    const timeRe = /^\s*(\d{2}:\d{2})\b(.*)$/;
    const skipRe = /team@chippercash\.com|Transaction Statement|^Page\s+\d+|^\s*DATE\s+TRANSACTION\s+ID\b/i;

    const txns = [];
    for (let i = 0; i < lines.length; i++) {
      const m = mainRe.exec(lines[i]);
      if (!m) continue;
      const [, dateStr, txnId, descStart, creditStr, debitStr, balanceStr] = m;

      let timeStr = null;
      const descRest = [];
      for (let j = i + 1; j < Math.min(lines.length, i + 8); j++) {
        const s = lines[j];
        if (ptrim(s) === '') continue;
        if (skipRe.test(s)) continue;
        if (mainRe.test(s)) break;
        if (timeStr === null) {
          const tm = timeRe.exec(s);
          if (tm) {
            timeStr = tm[1];
            const rest = ptrim(tm[2]);
            if (rest !== '') descRest.push(rest);
            continue;
          }
        }
        descRest.push(ptrim(s));
        if (descRest.length >= 3) break;
      }
      if (!timeStr) continue;

      const creditV = toKobo(creditStr) ?? 0;
      const debitV = Math.abs(toKobo(debitStr) ?? 0);
      const balanceV = toKobo(balanceStr);
      if (balanceV === null) continue;

      let t;
      let before;
      if (debitV > 0) {
        t = 'debit';
        before = balanceV + debitV;
      } else if (creditV > 0) {
        t = 'credit';
        before = balanceV - creditV;
      } else continue;

      let fullDesc = ptrim(descStart);
      if (descRest.length) fullDesc = ptrim(fullDesc + ' ' + descRest.join(' '));
      fullDesc = fullDesc.replace(/\s+/g, ' ');
      txns.push({
        transfer_type: t,
        balance_after: balanceV,
        balance_before: before,
        remarks: fullDesc !== '' ? `Ref: ${txnId} | ${fullDesc}` : `Ref: ${txnId}`,
        created_at: `${dateStr} ${timeStr}:00`,
      });
    }
    return txns;
  }

  // ---------- OPay ----------

  // One logical row over three lines: a description wrap above and below the
  // central "28 Jul 2025 21:33:53 …" data line. Debit/Credit use "--" as empty.
  function parseOPay(text) {
    const lines = text.split('\n');
    const n = lines.length;

    // The Savings Account (OWealth) section mirrors the wallet's movements and
    // would double-count them.
    let stopAt = n;
    for (let i = 0; i < n; i++) {
      if (/^\s*Savings Account\b/i.test(lines[i])) {
        stopAt = i;
        break;
      }
    }

    const dateRe = /^\s*(\d{2})\s+([A-Za-z]{3})\s+(\d{4})\s+(\d{2}):(\d{2}):(\d{2})\b/;
    const tailRe = /(--|[\d,]+\.\d{2})\s+(--|[\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([A-Za-z][A-Za-z]+)\b/g;
    const extractWrap = (s) => {
      const pieces = ptrim(s).split(/\s{2,}/);
      while (pieces.length && /^\d{2,}$/.test(pieces[pieces.length - 1])) pieces.pop();
      return ptrim(pieces.join(' '));
    };

    const txns = [];
    for (let i = 0; i < stopAt; i++) {
      const line = lines[i];
      const dm = dateRe.exec(line);
      if (!dm) continue;
      const mon = MONTHS[ucfirst(dm[2].toLowerCase())];
      if (!mon) continue;
      const dt = ymdhms(+dm[3], mon, +dm[1], +dm[4], +dm[5], +dm[6]);

      // The right-most "[debit] [credit] [balance] [channel]" run is the money tail.
      const tails = Array.from(line.matchAll(tailRe));
      if (!tails.length) continue;
      const tail = tails[tails.length - 1];
      const balanceV = toKobo(tail[3]);
      if (balanceV === null) continue;
      const debitV = tail[1] === '--' ? 0 : toKobo(tail[1]) ?? 0;
      const creditV = tail[2] === '--' ? 0 : toKobo(tail[2]) ?? 0;

      let type;
      let before;
      if (debitV > 0) {
        type = 'debit';
        before = balanceV + debitV;
      } else if (creditV > 0) {
        type = 'credit';
        before = balanceV - creditV;
      } else continue;

      let descSelf = '';
      const tailPos = line.lastIndexOf(tail[0]);
      if (tailPos >= 0) {
        const afterDates = line
          .slice(0, tailPos)
          .replace(/^\s*\d{2}\s+[A-Za-z]{3}\s+\d{4}\s+\d{2}:\d{2}:\d{2}\s+(?:\d{2}\s+[A-Za-z]{3}\s+\d{4})?/, '');
        descSelf = ptrim(afterDates.replace(/\s{2,}/g, ' '));
      }
      let prefix = '';
      if (i > 0 && ptrim(lines[i - 1]) !== '' && !dateRe.test(lines[i - 1])) prefix = extractWrap(lines[i - 1]);
      let suffix = '';
      if (i + 1 < n && ptrim(lines[i + 1]) !== '' && !dateRe.test(lines[i + 1])) suffix = extractWrap(lines[i + 1]);

      const fullDesc = ptrim([prefix, descSelf, suffix].filter((x) => x !== '').join(' ')).replace(/\s+/g, ' ');
      const row = { transfer_type: type, balance_after: balanceV, balance_before: before, remarks: fullDesc, created_at: dt };

      // "Transfer from|to NAME | BANK | ACCOUNT_NO | …"
      const cm = /Transfer\s+(from|to)\s+([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^\s|]+)/i.exec(fullDesc);
      if (cm) {
        const direction = cm[1].toLowerCase();
        if ((direction === 'from' && type === 'credit') || (direction === 'to' && type === 'debit')) {
          row.account_name = ptrim(cm[2]);
          row.bank_name = ptrim(cm[3]);
          row.account_number = ptrim(cm[4]);
        }
      }
      txns.push(row);
    }
    return txns;
  }

  // ---------- Import ----------

  // A statement's text → { bank, rows }. Rows get importText()'s finishing:
  // the absolute amount, anything under ₦60 as a charge, and a clean
  // counterparty name / NUBAN / canonical bank.
  function importText(text) {
    const [bank, parse] = detectBank(text);
    if (!bank) return { bank: null, rows: [] };
    const rows = [];
    for (const t of parse(text)) {
      if (!t.created_at) continue;
      const row = { transfer_category: 'transfer', account_name: null, account_number: null, bank_name: null, ...t };
      row.amount = Math.abs(row.balance_after - row.balance_before);
      if (row.amount < 6000) row.transfer_category = 'charge';
      [row.account_name, row.account_number] = cleanCounterpartyName(row.account_name, row.account_number);
      [row.account_name, row.bank_name] = splitBankFromName(row.account_name, row.bank_name);
      row.bank_name = canonicalBank(row.bank_name);
      rows.push(row);
    }
    return { bank, rows };
  }

  // ---------- PDF → text ----------
  // Mimics `pdftotext -layout`: each text item's transform composed with the
  // viewport (so rotated GTBank pages come out upright), bucketed into rows by
  // y and placed into character columns by x. Same as client/src/pdfExtract.js.
  const ROW_TOL = 3.0;
  const CHAR_W = 5.0;

  function layoutPage(pdfjsLib, content, viewport) {
    if (!content.items || content.items.length === 0) return '';
    const placed = [];
    for (const it of content.items) {
      if (!it.str) continue;
      const tm = it.transform;
      if (!tm || tm.length < 6) continue;
      const m = pdfjsLib.Util.transform(viewport.transform, tm);
      placed.push({ x: m[4], y: m[5], t: it.str });
    }
    if (placed.length === 0) return '';

    placed.sort((a, b) => a.y - b.y || a.x - b.x);
    const rows = [];
    let current = null;
    for (const it of placed) {
      if (!current || Math.abs(it.y - current.y) > ROW_TOL) {
        current = { y: it.y, items: [] };
        rows.push(current);
      }
      current.items.push(it);
    }

    const minX = Math.min(...placed.map((p) => p.x));
    const lines = [];
    for (const row of rows) {
      row.items.sort((a, b) => a.x - b.x);
      let line = '';
      for (const it of row.items) {
        const targetCol = Math.max(0, Math.round((it.x - minX) / CHAR_W));
        if (line.length < targetCol) line += ' '.repeat(targetCol - line.length);
        else if (line.length > 0 && line[line.length - 1] !== ' ') line += ' ';
        line += it.t;
      }
      lines.push(line.replace(/\s+$/, ''));
    }
    return lines.join('\n');
  }

  return { importText, layoutPage, cleanCounterpartyName, canonicalBank, splitBankFromName, titleCase, BANK_NAMES: RULES.map((r) => r[0]) };
})();
</script>
<script>
'use strict';

// ---------- Constants ----------

// The spending tags the server app ships with (CounterpartyTag::TAGS). New ones
// can be created from the tag picker.
const DEFAULT_TAGS = [
  'transport', 'fuel', 'groceries', 'food', 'clubbing',
  'shopping', 'clothes', 'hair', 'pedicure', 'manicure', 'electronics', 'gadgets', 'rent',
  'family', 'friend', 'man', 'woman', 'boy', 'girl', 'self', 'wife', 'husband',
  'boyfriend', 'girlfriend', 'pos', 'airtime & data',
  'charity', 'savings', 'investment', 'business income', 'business expense',
  'client', 'staff salary', 'work payment', 'gratitude', 'referral bonus', 'cut', 'travel', 'coin',
];
// Anyone who has paid in more than ₦40,000 in one go is tagged "client" on import.
const CLIENT_MIN = 40000 * 100;
const BANK_LABELS = { Kuda: 'Kuda', GTBank: 'GTBank', OPay: 'OPay', Moniepoint: 'Moniepoint', Alat: 'ALAT', Barter: 'Barter', Chipper: 'Chipper Cash' };
const SUPPORTED = 'Kuda, GTBank, OPay, Moniepoint, ALAT, Barter and Chipper Cash';
const THEME_KEY = 'statements-theme';
const PREFS_KEY = 'statements-prefs';
const PDFJS = {
  base: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/',
  lib: 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e',
  worker: 'sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2',
};
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map((m) => m.slice(0, 3));
